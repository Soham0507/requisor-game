kind = "web"
previewPath = "/internal-game-cyber-adventure/"
title = "GestureSec Runner"
version = "1.0.0"
id = "artifacts/gesturesec-runner"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/internal-game-cyber-adventure/" ]
localPort = 22882

[services.development]
run = "pnpm --filter @workspace/gesturesec-runner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gesturesec-runner", "run", "build" ]
publicDir = "artifacts/gesturesec-runner/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22882"
BASE_PATH = "/"
