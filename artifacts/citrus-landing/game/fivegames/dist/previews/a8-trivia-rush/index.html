<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trivia Rush — Activate</title><meta name="description" content="Play and customize Trivia Rush, an interactive branded game by Activate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>/* Layout concept: an Apple-style light product page for the library, and a full-bleed kiosk
   stage for each game. One idea per screen, big confident type, and the brand color only
   where the player acts. Light only, by request. */
:root {
  color-scheme: light;
  --bg: #F5F5F7;
  --stage: #FBFBFD;
  --surface: #FFFFFF;
  --ink: #1D1D1F;
  --ink-2: #6E6E73;
  --ink-3: #86868B;
  --line: rgba(0, 0, 0, .08);
  --line-2: #D2D2D7;
  --fill: rgba(118, 118, 128, .12);
  --fill-2: rgba(118, 118, 128, .07);
  --good: #34C759; --good-ink: #1F7A34; --good-50: #EAF7EE;
  --bad: #FF3B30; --bad-ink: #C9201A; --bad-50: #FFF0EF;
  --gold: #FFB340; --gold-ink: #9A5B00;
  --mint: #5BD49A; --mint-ink: #1F7A50;

  /* Brand tokens. The theme engine rewrites these for every brand kit. */
  --brand: #2F6BFF; --brand-rgb: 47, 107, 255;
  --brand-50: #F1F5FF; --brand-100: #E2EAFF; --brand-200: #C3D4FF; --brand-300: #97B5FF;
  --brand-600: #295EE0; --brand-700: #2250B8; --brand-text: #2F6BFF; --on-brand: #FFFFFF;

  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  --ease: cubic-bezier(.32, .72, 0, 1);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .04), 0 3px 10px rgba(0, 0, 0, .04);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, .04), 0 14px 34px rgba(0, 0, 0, .08);
  --shadow-3: 0 6px 16px rgba(0, 0, 0, .06), 0 32px 80px rgba(0, 0, 0, .16);
  --gutter: clamp(16px, 4vw, 40px);
}

@property --brand { syntax: '<color>'; inherits: true; initial-value: #2F6BFF; }
@property --brand-50 { syntax: '<color>'; inherits: true; initial-value: #F1F5FF; }
@property --brand-100 { syntax: '<color>'; inherits: true; initial-value: #E2EAFF; }
@property --brand-200 { syntax: '<color>'; inherits: true; initial-value: #C3D4FF; }
@property --brand-300 { syntax: '<color>'; inherits: true; initial-value: #97B5FF; }
@property --brand-600 { syntax: '<color>'; inherits: true; initial-value: #295EE0; }
@property --brand-700 { syntax: '<color>'; inherits: true; initial-value: #2250B8; }
@property --brand-text { syntax: '<color>'; inherits: true; initial-value: #2F6BFF; }

:root {
  transition: --brand .7s var(--ease), --brand-50 .7s var(--ease), --brand-100 .7s var(--ease),
    --brand-200 .7s var(--ease), --brand-300 .7s var(--ease), --brand-600 .7s var(--ease),
    --brand-700 .7s var(--ease), --brand-text .7s var(--ease);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -.022em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body.stage-open { overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select { font: inherit; color: inherit; }
img { max-width: 100%; }
svg.ic { flex: none; display: block; }
:focus-visible { outline: 3px solid rgba(var(--brand-rgb), .45); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Type ---------- */
.t-hero { font-size: clamp(40px, min(6.2vw, 9.6vh), 92px); line-height: 1.03; font-weight: 700; letter-spacing: -.035em; }
.t-title { font-size: clamp(32px, 4.2vw, 56px); line-height: 1.07; font-weight: 700; letter-spacing: -.03em; }
.t-headline { font-size: clamp(24px, 2.6vw, 32px); line-height: 1.15; font-weight: 700; letter-spacing: -.022em; }
.t-sub { font-size: clamp(19px, 1.8vw, 24px); line-height: 1.38; color: var(--ink-2); letter-spacing: -.016em; text-wrap: pretty; }
.t-callout { font-size: 17px; color: var(--ink-2); }
.t-foot { font-size: 13px; line-height: 1.4; color: var(--ink-3); letter-spacing: -.01em; }
.eyebrow { font-size: 17px; font-weight: 600; color: var(--brand-text); letter-spacing: -.016em; }
.eyebrow.muted { color: var(--ink-2); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 52px; padding: 0 28px; border-radius: 999px;
  font-size: 17px; font-weight: 600; letter-spacing: -.016em; white-space: nowrap;
  transition: transform .18s var(--ease), background-color .25s, box-shadow .25s, opacity .25s, color .25s;
  user-select: none; -webkit-user-select: none;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 8px 24px rgba(var(--brand-rgb), .26); }
.btn-primary:hover { background: var(--brand-600); }
.btn-secondary { background: var(--fill); color: var(--ink); }
.btn-secondary:hover { background: rgba(118, 118, 128, .18); }
.btn-ink { background: var(--ink); color: #fff; }
.btn-ink:hover { background: #000; }
.btn-ghost { color: var(--brand-text); height: 44px; padding: 0 12px; }
.btn-ghost:hover { text-decoration: underline; }
.btn-lg { height: 60px; padding: 0 34px; font-size: 19px; }
.btn-xl { height: 68px; padding: 0 40px; font-size: 21px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .35; pointer-events: none; box-shadow: none; }
.btn .ic { margin-right: -4px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; color: var(--ink);
  background: var(--fill-2); transition: background .2s, transform .18s var(--ease);
}
.icon-btn:hover { background: var(--fill); }
.icon-btn:active { transform: scale(.92); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
  border-radius: 999px; background: var(--fill-2); color: var(--ink-2);
  font-size: 14px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap;
}
.pill.brand { background: var(--brand-50); color: var(--brand-text); }
.pill.good { background: var(--good-50); color: var(--good-ink); }

/* ---------- Product tile (squircle) ---------- */
.ptile {
  --c: var(--brand); --s: 64px;
  width: var(--s); height: var(--s); flex: none;
  border-radius: calc(var(--s) * .27);
  display: grid; place-items: center; color: #fff; position: relative;
  background: var(--c);
  background:
    radial-gradient(120% 90% at 28% 8%, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 52%),
    linear-gradient(160deg, color-mix(in srgb, var(--c) 72%, #fff) 0%, var(--c) 52%, color-mix(in srgb, var(--c) 78%, #000) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -3px 8px rgba(0, 0, 0, .12),
    0 calc(var(--s) * .14) calc(var(--s) * .38) color-mix(in srgb, var(--c) 34%, transparent);
}
.ptile svg { width: 50%; height: 50%; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .18)); }
.ptile.soft { background: var(--brand-50); color: var(--brand-text); box-shadow: none; }

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); line-height: 1; white-space: nowrap; }
.logo .mark { width: 26px; height: 26px; flex: none; }
.logo .word { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.logo .word.caps { text-transform: uppercase; letter-spacing: .26em; font-weight: 600; font-size: 15px; }
.logo .word.light { font-weight: 400; color: var(--ink-2); }
.logo img { height: 30px; width: auto; max-width: 170px; object-fit: contain; }
.logo.lg .mark { width: 34px; height: 34px; }
.logo.lg .word { font-size: 23px; }
.logo.lg .word.caps { font-size: 19px; }
.logo.lg img { height: 40px; max-width: 220px; }

/* =========================================================
   LIBRARY
   ========================================================= */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: rgba(245, 245, 247, .78);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.nav-in { max-width: 1120px; margin: 0 auto; padding: 0 var(--gutter); height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.a8 { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
.a8-mark { width: 28px; height: 28px; }
.a8 b { color: var(--mint-ink); font-weight: 700; }
.a8 .by { font-family: var(--font-text); font-weight: 500; font-size: 13px; color: var(--ink-3); letter-spacing: -.01em; margin-left: 2px; }
.nav-actions { display: flex; align-items: center; gap: 8px; }
.leads-btn { height: 36px; padding: 0 14px; font-size: 15px; }
.count { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; letter-spacing: 0; }
.count.zero { background: var(--ink-3); }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: var(--gutter); }
.lib-hero { text-align: center; padding-block: clamp(48px, 9vw, 104px) clamp(28px, 4vw, 44px); }
.lib-hero .eyebrow { color: var(--ink-2); margin-bottom: 14px; display: inline-flex; align-items: center; gap: 8px; }
.lib-hero .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(91, 212, 154, .22); }
.lib-hero h1 { font-size: clamp(40px, 7vw, 84px); line-height: 1.03; font-weight: 700; letter-spacing: -.04em; max-width: 14ch; margin: 0 auto; }
.lib-hero h1 em { font-style: normal; color: var(--brand-text); }
.lib-hero p { margin: 20px auto 0; max-width: 40ch; font-size: clamp(19px, 2vw, 23px); line-height: 1.4; color: var(--ink-2); letter-spacing: -.018em; }

/* Brand kit */
.kit {
  background: var(--surface); border-radius: 28px; box-shadow: var(--shadow-1);
  padding: clamp(20px, 3vw, 32px); display: grid; gap: 22px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: center;
}
.kit-preview { display: flex; align-items: center; gap: 18px; min-width: 0; }
.kit-swatch {
  width: 76px; height: 76px; border-radius: 22px; flex: none; position: relative;
  background: linear-gradient(150deg, var(--brand-300), var(--brand) 55%, var(--brand-700));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 12px 28px rgba(var(--brand-rgb), .32);
}
.kit-meta { min-width: 0; display: grid; gap: 6px; }
.kit-meta .label { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.kit-meta .vert { font-size: 15px; color: var(--ink-2); }
.kit-controls { display: grid; gap: 14px; min-width: 0; }
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px;
  background: var(--fill); border-radius: 12px; padding: 3px; position: relative;
}
.seg button {
  height: 38px; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--ink);
  letter-spacing: -.01em; position: relative; z-index: 1; transition: color .2s; padding: 0 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.seg .thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 9px; background: #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
  transition: transform .45s var(--ease), width .45s var(--ease);
}
.custom-fields { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.custom-fields .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline-input {
  height: 44px; border-radius: 12px; border: 1px solid var(--line-2); padding: 0 14px; background: #fff;
  font-size: 16px; width: 100%; min-width: 0; outline: none; transition: border-color .2s, box-shadow .2s;
}
.inline-input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(var(--brand-rgb), .14); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .2s var(--spring); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--c); }
.swatches button:hover { transform: scale(1.1); }
.upload { position: relative; overflow: hidden; height: 44px; padding: 0 16px; font-size: 15px; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.kit-note { font-size: 13px; color: var(--ink-3); }
.toggle-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
.toggle-line .t { display: grid; }
.toggle-line .t small { color: var(--ink-3); font-size: 13px; }

/* Bento */
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: clamp(44px, 6vw, 72px) 0 20px; flex-wrap: wrap; }
.section-head h2 { font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -.03em; line-height: 1.1; }
.section-head p { color: var(--ink-2); max-width: 46ch; }
.bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; }
.tile {
  position: relative; background: var(--surface); border-radius: 28px; overflow: hidden;
  box-shadow: var(--shadow-1); display: flex; flex-direction: column; text-align: left; min-width: 0;
  transition: transform .5s var(--ease), box-shadow .5s var(--ease);
}
.tile:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); }
.tile:active { transform: scale(.985); }
.tile-copy { padding: 28px 28px 0; display: grid; gap: 8px; position: relative; z-index: 2; }
.tile-kind { font-size: 15px; font-weight: 600; color: var(--brand-text); }
.tile h3 { font-size: clamp(28px, 3vw, 40px); line-height: 1.05; letter-spacing: -.03em; font-weight: 700; }
.tile p { color: var(--ink-2); font-size: 17px; max-width: 42ch; }
.tile-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tile-art { position: relative; flex: 1; min-height: 210px; display: grid; place-items: center; padding: 20px 24px 28px; }
.tile-play {
  position: absolute; top: 22px; right: 22px; z-index: 3; width: 44px; height: 44px; border-radius: 50%;
  background: var(--brand); color: var(--on-brand); display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(var(--brand-rgb), .32); transition: transform .3s var(--spring);
}
.tile:hover .tile-play { transform: scale(1.08); }
.tile.t-match { grid-column: span 4; }
.tile.t-trivia, .tile.t-number, .tile.t-spin, .tile.t-recall { grid-column: span 2; }
.tile.t-match .tile-copy { padding: 36px 36px 0; }
.tile.t-match h3 { font-size: clamp(36px, 4.6vw, 60px); }

/* Tile art: Match */
.art-match { position: relative; width: 100%; max-width: 580px; padding-bottom: 62px; }
.art-match .am-card { background: var(--bg); border-radius: 26px; padding: 22px; display: grid; gap: 16px; box-shadow: inset 0 0 0 1px var(--line); }
.art-match .bar { display: flex; gap: 6px; padding: 0 18%; }
.art-match .bar i { flex: 1; height: 5px; border-radius: 3px; background: rgba(118, 118, 128, .16); }
.art-match .am-result { position: absolute; right: -4px; bottom: 0; display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 22px; padding: 14px 22px 14px 14px; box-shadow: var(--shadow-3); max-width: min(360px, 92%); }
.art-match .am-result > div { min-width: 0; }
.art-match .am-result .k { display: block; font-size: 13px; font-weight: 600; color: var(--brand-text); }
.art-match .am-result b { display: block; font-size: 21px; line-height: 1.15; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.art-match .am-result .l { display: block; font-size: 13px; color: var(--ink-2); }
.art-match .bar i.on { background: var(--brand); }
.art-match .q { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.2vw, 26px); letter-spacing: -.02em; text-align: center; }
.art-match .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.art-match .opt { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); font-weight: 600; font-size: 16px; min-width: 0; }
.art-match .opt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.art-match .opt .ptile { --s: 40px; }
.art-match .opt.sel { box-shadow: 0 0 0 2.5px var(--brand), var(--shadow-2); }
.art-match .opt:not(.sel) .ptile { background: var(--brand-50); color: var(--brand-text); box-shadow: none; }
.art-match .opt:not(.sel) .ptile svg { filter: none; }
/* Tile art: Trivia */
.art-trivia { display: grid; justify-items: center; gap: 14px; width: 100%; }
.ring { --p: .7; --sz: 104px; width: var(--sz); height: var(--sz); border-radius: 50%; position: relative; display: grid; place-items: center;
  background: conic-gradient(var(--brand) calc(var(--p) * 360deg), var(--fill) 0); }
.ring::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: #fff; }
.ring b { position: relative; font-family: var(--font-round); font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
.art-trivia .ans { width: 100%; max-width: 260px; display: grid; gap: 8px; }
.art-trivia .ans div { height: 40px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line); display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; font-weight: 600; }
.art-trivia .ans div.ok { background: var(--good-50); box-shadow: 0 0 0 2px var(--good); }
.art-trivia .ans div .ic { color: var(--good-ink); margin-left: auto; }
/* Tile art: Number */
.art-number { display: grid; justify-items: center; gap: 10px; width: 100%; }
.art-number .big { font-family: var(--font-round); font-weight: 700; font-size: clamp(64px, 7vw, 92px); letter-spacing: -.04em; line-height: 1;
  background: linear-gradient(180deg, var(--brand-300), var(--brand) 60%, var(--brand-700)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.art-number .unit { font-size: 15px; color: var(--ink-2); font-weight: 600; }
.art-number .ruler { width: 100%; max-width: 260px; height: 34px; position: relative;
  background: repeating-linear-gradient(90deg, var(--ink-3) 0 1.5px, transparent 1.5px 13px) bottom / 100% 14px no-repeat,
              repeating-linear-gradient(90deg, var(--ink-2) 0 2px, transparent 2px 65px) bottom / 100% 24px no-repeat;
  -webkit-mask: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
.art-number .needle { position: relative; width: 3px; height: 40px; border-radius: 2px; background: var(--brand); margin-top: -46px; }
/* Tile art: Spin */
.art-spin { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; flex-wrap: wrap; }
.art-spin .mini-wheel { width: min(200px, 60vw); aspect-ratio: 1; position: relative; }
.art-spin .mini-wheel svg.wheel-spin { animation: idle-spin 40s linear infinite; }
.art-spin .boosts { display: grid; gap: 8px; }
.art-spin .boosts div { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.art-spin .boosts .b { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--fill-2); color: var(--ink-3); }
.art-spin .boosts .b.on { background: var(--gold); color: #fff; }
/* Tile art: Recall */
.art-recall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 360px; }
.art-recall i { aspect-ratio: 1; border-radius: 14px; background: linear-gradient(150deg, var(--brand-300), var(--brand) 60%, var(--brand-700)); display: grid; place-items: center; color: rgba(255,255,255,.85); }
.art-recall i.up { background: #fff; color: var(--brand-text); box-shadow: 0 0 0 1px var(--line), var(--shadow-1); }
.art-recall i.hit { background: #fff; color: var(--brand-text); box-shadow: 0 0 0 2.5px var(--brand); }

.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.how-step { background: var(--surface); border-radius: 24px; padding: 24px; box-shadow: var(--shadow-1); display: grid; gap: 8px; align-content: start; }
.how-step .n { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; font-family: var(--font-round); }
.how-step h3 { font-size: 21px; letter-spacing: -.02em; }
.how-step p { color: var(--ink-2); font-size: 16px; }
.lib-foot { padding-block: 56px 72px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--ink-3); font-size: 13px; border-top: 1px solid var(--line); margin-top: 64px; }

@media (max-width: 980px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile.t-match { grid-column: span 2; }
  .tile.t-trivia, .tile.t-number, .tile.t-spin, .tile.t-recall { grid-column: span 1; }
  .kit { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .bento { grid-template-columns: minmax(0, 1fr); }
  .tile.t-match, .tile.t-trivia, .tile.t-number, .tile.t-spin, .tile.t-recall { grid-column: span 1; }
  .tile-copy, .tile.t-match .tile-copy { padding: 24px 24px 0; }
  .how { grid-template-columns: minmax(0, 1fr); }
  .a8 .by { display: none; }
  .seg button { font-size: 13px; }
  .custom-fields { grid-template-columns: minmax(0, 1fr); }
}

/* =========================================================
   STAGE
   ========================================================= */
.stage {
  position: fixed; inset: 0; z-index: 100; background: var(--stage); overflow: hidden;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  animation: stage-in .5s var(--ease);
}
.stage input, .stage textarea { user-select: text; -webkit-user-select: text; }
@keyframes stage-in { from { opacity: 0; transform: scale(1.02); } }
.aura { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.aura i { position: absolute; border-radius: 50%; width: 70vmax; height: 70vmax; opacity: .9; will-change: transform; }
.aura i:nth-child(1) { left: -22vmax; top: -30vmax; background: radial-gradient(closest-side, rgba(var(--brand-rgb), .17), rgba(var(--brand-rgb), 0)); animation: drift1 22s ease-in-out infinite alternate; }
.aura i:nth-child(2) { right: -28vmax; bottom: -34vmax; background: radial-gradient(closest-side, rgba(var(--brand-rgb), .12), rgba(var(--brand-rgb), 0)); animation: drift2 26s ease-in-out infinite alternate; }
.aura i:nth-child(3) { left: 30%; top: 40%; width: 40vmax; height: 40vmax; background: radial-gradient(closest-side, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0)); animation: drift1 30s ease-in-out infinite alternate-reverse; }
.stage.quiet .aura { opacity: .45; transition: opacity 1s; }
@keyframes drift1 { to { transform: translate(10vmax, 8vmax) scale(1.1); } }
@keyframes drift2 { to { transform: translate(-8vmax, -10vmax) scale(1.08); } }

.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  padding: env(safe-area-inset-top, 0px) clamp(14px, 2.4vw, 28px) 0;
  height: calc(68px + env(safe-area-inset-top, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px;
}
.tb-left { min-width: 0; display: flex; align-items: center; }
.tb-center { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0; }
.tb-right { display: flex; justify-content: flex-end; gap: 8px; }
.tb-right .icon-btn { background: rgba(255, 255, 255, .7); box-shadow: 0 0 0 1px var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.capsules { display: flex; gap: 6px; width: clamp(140px, 26vw, 300px); }
.capsules i { flex: 1; height: 5px; border-radius: 3px; background: rgba(118, 118, 128, .16); position: relative; overflow: hidden; }
.capsules i::after { content: ''; position: absolute; inset: 0; background: var(--brand); border-radius: inherit; transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease); }
.capsules i.done::after { transform: scaleX(1); }
.capsules i.now::after { transform: scaleX(.42); }
.hud-pill {
  height: 40px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255, 255, 255, .78); box-shadow: 0 0 0 1px var(--line), var(--shadow-1);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  font-family: var(--font-round); font-weight: 700; font-size: 17px; letter-spacing: -.01em; font-variant-numeric: tabular-nums;
}
.hud-pill small { font-family: var(--font-text); font-weight: 500; font-size: 13px; color: var(--ink-3); }
.hud-pill .ic { color: var(--brand-text); }
.hud-pill.warn { color: var(--bad-ink); }
.hud-pill.warn .ic { color: var(--bad); }

.screens { position: absolute; inset: 0; z-index: 1; transition: filter .5s var(--ease), transform .5s var(--ease); }
.screen {
  position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column;
  padding: calc(84px + env(safe-area-inset-top, 0px)) clamp(16px, 4vw, 48px) calc(28px + env(safe-area-inset-bottom, 0px));
  opacity: 0; transform: translateY(18px) scale(.985);
}
.screen > .inner { margin: auto; width: 100%; max-width: 1120px; position: relative; }
.screen.active { opacity: 1; transform: none; transition: opacity .55s var(--ease), transform .7s var(--ease); }
.screen.leave { opacity: 0; transform: translateY(-14px) scale(.985); transition: opacity .3s ease, transform .4s var(--ease); pointer-events: none; }
.screens.dim .screen.active { filter: blur(16px) saturate(1.05); transform: scale(.97); transition: filter .6s var(--ease), transform .6s var(--ease); }
.powered { flex: none; margin-top: 18px; text-align: center; font-size: 12px; color: var(--ink-3); letter-spacing: 0; pointer-events: none; }
.powered b { color: var(--ink-2); font-weight: 600; }

/* Attract */
.attract { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
.attract-copy { display: grid; gap: 18px; justify-items: start; }
.attract-copy .t-hero { max-width: 12ch; }
.attract-copy .t-sub { max-width: 30ch; }
.attract-cta { margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.attract-cta .btn-primary { animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 8px 24px rgba(var(--brand-rgb), .26), 0 0 0 10px rgba(var(--brand-rgb), .08); } }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--ink-2); font-size: 15px; margin-top: 4px; }
.meta-row span { display: inline-flex; align-items: center; gap: 6px; }
.meta-row .ic { color: var(--brand-text); }
.prize-line { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); font-weight: 600; font-size: 15px; }
.prize-line .ptile { --s: 30px; }
.attract-art { display: grid; place-items: center; min-height: 300px; position: relative; }
.attract-logo { margin-bottom: 6px; }

@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  .attract { grid-template-columns: minmax(0, 1fr); text-align: center; gap: 28px; }
  .attract-copy { justify-items: center; }
  .attract-copy .t-hero, .attract-copy .t-sub { margin-inline: auto; }
  .attract-cta, .meta-row { justify-content: center; }
  .attract-art { min-height: 0; }
}

/* Generic question layout */
.qwrap { width: 100%; max-width: 980px; margin: 0 auto; display: grid; gap: clamp(20px, 3vw, 34px); }
.qhead { display: grid; gap: 12px; justify-items: center; text-align: center; }
.qtext { font-size: clamp(30px, 4vw, 52px); line-height: 1.08; font-weight: 700; letter-spacing: -.03em; max-width: 20ch; }
.qtext.sm { font-size: clamp(26px, 3.2vw, 42px); }
.qnav { display: flex; justify-content: center; }

.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.option {
  position: relative; display: flex; align-items: center; gap: 18px; padding: 20px 22px; min-height: 108px;
  border-radius: 24px; background: #fff; text-align: left; width: 100%;
  box-shadow: 0 0 0 1px var(--line), var(--shadow-1);
  transition: transform .2s var(--ease), box-shadow .3s var(--ease), background .3s, opacity .3s;
  animation: rise .6s var(--ease) backwards;
}
.option .olabel, .option .osub { display: block; }
.option:hover { box-shadow: 0 0 0 1.5px var(--brand-200), var(--shadow-2); }
.option:active { transform: scale(.98); }
.otile { width: 58px; height: 58px; border-radius: 17px; background: var(--brand-50); color: var(--brand-text); display: grid; place-items: center; flex: none; transition: background .3s, color .3s, transform .4s var(--spring); }
.option .olabel { font-size: 20px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
.option .osub { font-size: 15px; color: var(--ink-2); margin-top: 3px; letter-spacing: -.01em; line-height: 1.35; }
.option .ocheck { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; transform: scale(0); transition: transform .4s var(--spring); }
.option.selected { box-shadow: 0 0 0 3px var(--brand), var(--shadow-2); background: linear-gradient(180deg, #fff, var(--brand-50)); }
.option.selected .otile { background: var(--brand); color: var(--on-brand); transform: scale(1.06) rotate(-4deg); }
.option.selected .ocheck { transform: scale(1); }
.options.locked .option:not(.selected) { opacity: .5 !important; transition: opacity .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.answers.one { grid-template-columns: minmax(0, 1fr); }
.answer {
  display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 14px 18px; border-radius: 20px;
  background: #fff; text-align: left; font-size: 19px; font-weight: 600; letter-spacing: -.018em; line-height: 1.25;
  box-shadow: 0 0 0 1px var(--line), var(--shadow-1); position: relative; width: 100%;
  transition: transform .18s var(--ease), box-shadow .25s, background .25s, opacity .3s;
  animation: rise .5s var(--ease) backwards;
}
.answer:hover { box-shadow: 0 0 0 1.5px var(--brand-200), var(--shadow-2); }
.answer:active { transform: scale(.98); }
.answer .key { width: 34px; height: 34px; border-radius: 11px; background: var(--fill-2); display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--ink-2); flex: none; font-family: var(--font-round); transition: background .25s, color .25s; }
.answer .mark { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; transform: scale(0); transition: transform .4s var(--spring); flex: none; }
.answer.correct { background: var(--good-50); box-shadow: 0 0 0 2.5px var(--good); }
.answer.correct .key { background: var(--good); color: #fff; }
.answer.correct .mark { background: var(--good); color: #fff; transform: scale(1); }
.answer.wrong { background: var(--bad-50); box-shadow: 0 0 0 2.5px var(--bad); animation: shake .45s var(--ease); }
.answer.wrong .key { background: var(--bad); color: #fff; }
.answer.wrong .mark { background: var(--bad); color: #fff; transform: scale(1); }
.answers.locked .answer:not(.correct):not(.wrong) { opacity: .4; }
.answers.locked .answer { pointer-events: none; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

.fact {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border-radius: 18px;
  background: #fff; box-shadow: 0 0 0 1px var(--line), var(--shadow-2); max-width: 640px; margin: 0 auto;
  font-size: 16px; line-height: 1.4; color: var(--ink); animation: pop-in .5s var(--spring);
}
.fact .ic { color: var(--brand-text); margin-top: 1px; }
.fact b { color: var(--brand-text); font-weight: 600; }
@keyframes pop-in { from { opacity: 0; transform: translateY(10px) scale(.96); } }

.floater { position: absolute; z-index: 30; pointer-events: none; font-family: var(--font-round); font-weight: 800; font-size: 28px; color: var(--good-ink); animation: float-up 1.1s var(--ease-out) forwards; text-shadow: 0 2px 10px rgba(255,255,255,.9); }
@keyframes float-up { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); } 20% { opacity: 1; transform: translate(-50%, -6px) scale(1.06); } 100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } }

/* Countdown */
.countdown { display: grid; place-items: center; min-height: 50vh; }
.countdown b { font-family: var(--font-round); font-weight: 800; font-size: clamp(140px, 24vw, 280px); line-height: 1; letter-spacing: -.05em; color: var(--brand-text); animation: count-pop .76s var(--ease-out) both; }
.countdown b.go { color: var(--ink); }
@keyframes count-pop { 0% { opacity: 0; transform: scale(1.5); filter: blur(10px); } 22% { opacity: 1; transform: scale(1); filter: blur(0); } 80% { opacity: 1; transform: scale(.97); } 100% { opacity: 0; transform: scale(.9); } }
.bigword { text-align: center; display: grid; gap: 10px; justify-items: center; }
.bigword h2 { font-size: clamp(64px, 11vw, 140px); line-height: 1; letter-spacing: -.05em; animation: pop-in .6s var(--spring); }

/* Toast */
.toast-host { position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: grid; justify-items: center; pointer-events: none; padding: 0 16px; }
.toast {
  display: inline-flex; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; border-radius: 999px;
  background: rgba(29, 29, 31, .92); color: #fff; font-size: 16px; font-weight: 500; letter-spacing: -.01em;
  box-shadow: var(--shadow-3); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  animation: toast-in .5s var(--spring); max-width: 100%;
}
.toast .ptile { --s: 34px; }
.toast b { font-weight: 700; }
.toast.out { animation: toast-out .35s var(--ease) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(20px) scale(.9); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(12px) scale(.96); } }

/* Sheet (lead capture, idle prompt, leads list) */
.sheet-layer { position: fixed; inset: 0; z-index: 200; display: grid; align-items: end; justify-items: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(29, 29, 31, .1); animation: fade-in .4s ease; }
.sheet {
  position: relative; width: min(600px, 100%); max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  background: #fff; border-radius: 30px 30px 0 0; box-shadow: var(--shadow-3);
  padding: 14px clamp(20px, 4vw, 34px) calc(26px + env(safe-area-inset-bottom, 0px));
  animation: sheet-up .55s var(--ease);
}
.sheet.wide { width: min(880px, 100%); }
.sheet-grab { width: 40px; height: 5px; border-radius: 3px; background: var(--fill); margin: 0 auto 14px; }
.sheet-close { position: absolute; top: 16px; right: 16px; }
.sheet-head { display: grid; gap: 8px; justify-items: center; text-align: center; margin-bottom: 22px; }
.sheet-head .ptile { --s: 56px; margin-bottom: 6px; }
.sheet-head h2 { font-size: clamp(26px, 3vw, 32px); line-height: 1.12; letter-spacing: -.026em; }
.sheet-head p { color: var(--ink-2); max-width: 36ch; }
.sheet-layer.out .sheet { animation: sheet-down .35s var(--ease) forwards; }
.sheet-layer.out .sheet-backdrop { animation: fade-out .35s ease forwards; }
@keyframes sheet-up { from { transform: translateY(100%); } }
@keyframes sheet-down { to { transform: translateY(105%); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@media (min-width: 720px) and (min-height: 620px) {
  .sheet-layer { align-items: center; padding: 24px; }
  .sheet { border-radius: 30px; padding-top: 30px; padding-bottom: 30px; animation: modal-in .55s var(--ease); }
  .sheet-grab { display: none; }
  .sheet-layer.out .sheet { animation: modal-out .3s var(--ease) forwards; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(24px) scale(.96); } }
  @keyframes modal-out { to { opacity: 0; transform: translateY(12px) scale(.97); } }
}

/* Lead form */
.lead-form { display: grid; gap: 12px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field { position: relative; display: block; }
.field input {
  width: 100%; height: 60px; padding: 24px 16px 6px; border: 1px solid var(--line-2); border-radius: 14px; background: #fff;
  font-size: 17px; letter-spacing: -.016em; outline: none; transition: border-color .2s, box-shadow .2s, background .2s; -webkit-appearance: none; appearance: none;
}
.field > .flabel { position: absolute; left: 17px; top: 30px; transform: translateY(-50%); color: var(--ink-3); font-size: 17px; pointer-events: none; transition: top .22s var(--ease), font-size .22s var(--ease), color .2s; letter-spacing: -.016em; }
.field input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(var(--brand-rgb), .14); }
.field input:focus + .flabel, .field input:not(:placeholder-shown) + .flabel { top: 17px; font-size: 12px; color: var(--ink-2); letter-spacing: -.005em; }
.field .opt { color: var(--ink-3); font-weight: 400; }
.field.invalid input { border-color: var(--bad); background: #FFFBFA; box-shadow: 0 0 0 4px rgba(255, 59, 48, .1); }
.ferr { font-size: 13px; color: var(--bad-ink); margin: 6px 4px 0; display: flex; gap: 6px; align-items: center; line-height: 1.3; }
.domains { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-top: -2px; padding: 2px; }
.domains::-webkit-scrollbar { display: none; }
.domains button { height: 34px; padding: 0 12px; border-radius: 999px; background: var(--fill-2); font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; flex: none; }
.domains button:hover { background: var(--fill); color: var(--ink); }
.choice { display: grid; gap: 8px; }
.choice-label { font-size: 13px; color: var(--ink-2); padding-left: 4px; }
.choice-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-chips button { height: 40px; padding: 0 16px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px var(--line-2); font-size: 15px; font-weight: 500; transition: background .2s, box-shadow .2s, color .2s; }
.choice-chips button[aria-pressed="true"] { background: var(--brand-50); box-shadow: inset 0 0 0 2px var(--brand); color: var(--brand-text); font-weight: 600; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-radius: 14px; background: var(--fill-2); font-size: 15px; line-height: 1.35; cursor: pointer; }
.switch { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 31px; background: #E3E3E6; position: relative; flex: none; cursor: pointer; transition: background .3s; margin: 0; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16); transition: transform .3s var(--ease); }
.switch:checked { background: var(--brand); }
.switch:checked::after { transform: translateX(20px); }
.fine { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; text-align: center; letter-spacing: -.005em; }
.fine a { color: var(--ink-2); }
.lead-form .btn-primary { margin-top: 6px; height: 58px; font-size: 18px; }
@media (max-width: 420px) { .frow { grid-template-columns: minmax(0, 1fr); } }

/* Results */
.result { display: grid; gap: clamp(20px, 3vw, 30px); justify-items: center; text-align: center; max-width: 920px; margin: 0 auto; }
.result-head { display: grid; gap: 10px; justify-items: center; }
.result-score { font-family: var(--font-round); font-weight: 800; font-size: clamp(64px, min(12vw, 15vh), 148px); line-height: .95; letter-spacing: -.05em; color: var(--ink); font-variant-numeric: tabular-nums; }
.result-score small { font-size: .3em; color: var(--ink-3); letter-spacing: -.02em; font-weight: 700; margin-left: 6px; }
.stats { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 640px; }
.stat { background: #fff; border-radius: 20px; padding: 16px 12px; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-round); font-size: clamp(24px, 3vw, 32px); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-2); }
.result-cols { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 20px; width: 100%; text-align: left; align-items: start; }
@media (max-width: 760px) { .result-cols { grid-template-columns: minmax(0, 1fr); } }
.takehome { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 22px; padding: 14px 18px 14px 14px; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); text-align: left; max-width: 460px; width: 100%; }
.takehome .qr { width: 92px; height: 92px; border-radius: 12px; flex: none; background: #fff; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.takehome .qr canvas { width: 82px; height: 82px; image-rendering: pixelated; }
.takehome b { font-size: 17px; letter-spacing: -.016em; display: block; }
.takehome span { font-size: 14px; color: var(--ink-2); display: block; }
.takehome code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); word-break: break-all; display: block; margin-top: 4px; letter-spacing: 0; }
.result-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
.reset-note { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
.reset-note .mini-ring { --p: 1; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--ink-3) calc(var(--p) * 360deg), var(--fill) 0); -webkit-mask: radial-gradient(circle, transparent 5px, #000 5.5px); mask: radial-gradient(circle, transparent 5px, #000 5.5px); }
.reset-note button { color: var(--ink-2); text-decoration: underline; font-size: 13px; }

/* Leaderboard */
.board { text-align: left; background: #fff; border-radius: 24px; padding: 8px; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); width: 100%; }
.board-title { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 8px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.board-title .ic { color: var(--gold); }
.brow { display: grid; grid-template-columns: 30px 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 15px; position: relative; }
.brow + .brow::before { content: ''; position: absolute; top: 0; left: 90px; right: 12px; height: 1px; background: var(--line); }
.brow.me { background: var(--brand-50); animation: me-in .8s var(--spring) both; }
.brow.me::before, .brow.me + .brow::before { display: none; }
@keyframes me-in { from { opacity: 0; transform: translateY(30px) scale(.96); } }
.brow .rk { font-family: var(--font-round); font-weight: 700; color: var(--ink-3); text-align: center; font-size: 16px; }
.brow .rk.top { color: var(--gold-ink); }
.brow .av { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--ink-2); letter-spacing: 0; }
.brow.me .av { background: var(--brand); color: var(--on-brand); }
.brow .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
.brow .nm small { font-weight: 600; font-size: 11px; color: var(--brand-text); background: #fff; border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 2px; box-shadow: 0 0 0 1px var(--brand-200); }
.brow .sc { font-family: var(--font-round); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 17px; }
.brow.gap { grid-template-columns: 1fr; padding: 0; height: 18px; color: var(--ink-3); text-align: center; font-size: 13px; line-height: 1; }

/* Idle */
.idle-ring { --p: 1; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--brand) calc(var(--p) * 360deg), var(--fill) 0); margin: 0 auto 6px; }
.idle-ring b { width: 70px; height: 70px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-family: var(--font-round); font-weight: 800; font-size: 30px; }

canvas.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* =========================================================
   GAME: MATCH
   ========================================================= */
.m-art { position: relative; width: min(100%, 460px); aspect-ratio: 1.05; }
.m-art .ptile { position: absolute; animation: bob 6s ease-in-out infinite; }
.m-art .ptile:nth-child(1) { --s: clamp(96px, 13vw, 150px); left: 6%; top: 30%; animation-delay: -1s; }
.m-art .ptile:nth-child(2) { --s: clamp(120px, 17vw, 196px); left: 36%; top: 6%; z-index: 2; animation-delay: -3s; }
.m-art .ptile:nth-child(3) { --s: clamp(90px, 12vw, 140px); right: 4%; top: 42%; animation-delay: -2s; }
.m-art .ptile:nth-child(4) { --s: clamp(72px, 9vw, 104px); left: 40%; bottom: 2%; animation-delay: -4.5s; }
.m-art .chip { position: absolute; z-index: 3; left: 50%; top: 64%; transform: translateX(-50%); }
@keyframes bob { 50% { transform: translateY(-12px) rotate(-2deg); } }

.m-shuffle { display: grid; justify-items: center; gap: 30px; text-align: center; }
.m-shuffle .row { display: flex; gap: clamp(14px, 3vw, 28px); align-items: center; justify-content: center; }
.m-shuffle .ptile { --s: clamp(72px, 11vw, 120px); transition: transform .35s var(--spring), opacity .35s, filter .35s; opacity: .35; filter: saturate(.3); }
.m-shuffle .ptile.hot { opacity: 1; filter: none; transform: scale(1.14) translateY(-6px); }

.m-reveal { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(24px, 5vw, 64px); align-items: center; text-align: left; }
.m-hero { position: relative; display: grid; place-items: center; aspect-ratio: 1; width: min(100%, 440px); justify-self: center; }
.m-hero .halo { position: absolute; inset: 4%; border-radius: 50%; background: conic-gradient(from 0deg, color-mix(in srgb, var(--c) 0%, transparent), color-mix(in srgb, var(--c) 40%, transparent), color-mix(in srgb, var(--c) 0%, transparent) 60%); animation: idle-spin 8s linear infinite; filter: blur(18px); opacity: .9; }
.m-hero .disc { position: absolute; inset: 12%; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff, color-mix(in srgb, var(--c) 10%, #fff)); box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
.m-hero .ptile { --s: clamp(150px, 22vw, 230px); animation: hero-in 1s var(--spring) both; }
.m-hero .pct { position: absolute; right: 2%; top: 10%; z-index: 3; animation: pop-in .7s .5s var(--spring) both; }
.pct-ring { --p: .9; width: 108px; height: 108px; border-radius: 50%; background: conic-gradient(var(--c, var(--brand)) calc(var(--p) * 360deg), rgba(118,118,128,.14) 0); display: grid; place-items: center; box-shadow: var(--shadow-2); }
.pct-ring div { width: 92px; height: 92px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.pct-ring b { font-family: var(--font-round); font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.pct-ring small { display: block; font-size: 11px; color: var(--ink-2); font-weight: 600; }
@keyframes hero-in { from { opacity: 0; transform: scale(.4) rotate(-12deg); } }
.m-copy { display: grid; gap: 14px; justify-items: start; }
.m-copy .name { font-size: clamp(48px, 7.4vw, 96px); line-height: .98; font-weight: 700; letter-spacing: -.045em; }
.m-copy .line { font-size: clamp(19px, 2vw, 24px); color: var(--ink-2); line-height: 1.38; max-width: 28ch; letter-spacing: -.016em; }
.specs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; margin-top: 6px; }
.spec { background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); min-width: 0; }
.spec .ic { color: var(--c, var(--brand-text)); margin-bottom: 8px; }
.spec b { display: block; font-size: clamp(19px, 2.2vw, 24px); letter-spacing: -.02em; line-height: 1.1; }
.spec span { display: block; font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.3; }
.runner { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-2); }
.runner .ptile { --s: 28px; }
@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  .m-reveal { grid-template-columns: minmax(0, 1fr); text-align: center; }
  .m-copy { justify-items: center; }
  .m-copy .line { margin-inline: auto; }
  .m-hero { width: min(100%, 320px); }
}
@media (max-width: 520px) {
  .options { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .option { min-height: 84px; padding: 14px 16px; gap: 14px; border-radius: 20px; }
  .otile { width: 48px; height: 48px; border-radius: 14px; }
  .option .olabel { font-size: 18px; }
  .option .osub { font-size: 14px; }
  .answers { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .answer { min-height: 62px; font-size: 17px; }
  .specs { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .spec { padding: 12px 10px; }
}

/* =========================================================
   GAME: TRIVIA
   ========================================================= */
.tr-art { position: relative; display: grid; place-items: center; width: min(100%, 420px); aspect-ratio: 1; }
.tr-art .ring { --sz: clamp(220px, 30vw, 340px); --p: .72; background: conic-gradient(var(--brand) calc(var(--p) * 360deg), rgba(118,118,128,.12) 0); box-shadow: var(--shadow-2); }
.tr-art .ring::before { inset: clamp(16px, 2vw, 22px); }
.tr-art .ring b { font-size: clamp(76px, 10vw, 120px); letter-spacing: -.05em; }
.tr-art .ring small { position: relative; display: block; text-align: center; font-size: 15px; color: var(--ink-2); font-weight: 600; margin-top: -6px; }
.tr-art .ring .in { position: relative; display: grid; justify-items: center; }
.tr-art .badge { position: absolute; display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px; background: #fff; box-shadow: var(--shadow-2); font-weight: 600; font-size: 15px; animation: bob 5s ease-in-out infinite; }
.tr-art .badge.b1 { left: -2%; top: 16%; }
.tr-art .badge.b2 { right: -4%; top: 48%; animation-delay: -2s; }
.tr-art .badge.b3 { left: 6%; bottom: 8%; animation-delay: -3.5s; }
.tr-art .badge .ic { color: var(--brand-text); }
.tr-art .badge.good .ic { color: var(--good); }
.timer-ring { --p: 1; width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(var(--brand) calc(var(--p) * 360deg), rgba(118,118,128,.18) 0); -webkit-mask: radial-gradient(circle, transparent 9px, #000 9.5px); mask: radial-gradient(circle, transparent 9px, #000 9.5px); }
.hud-pill.warn .timer-ring { background: conic-gradient(var(--bad) calc(var(--p) * 360deg), rgba(255,59,48,.18) 0); }
.streak { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: linear-gradient(135deg, #FF9F0A, #FF6B00); color: #fff; font-weight: 700; font-size: 14px; font-family: var(--font-round); box-shadow: 0 6px 16px rgba(255, 120, 0, .3); animation: pop-in .4s var(--spring); }
.streak.off { background: var(--fill-2); color: var(--ink-3); box-shadow: none; }
.tr-meta { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
.tr-fact-slot { min-height: 64px; }

/* =========================================================
   GAME: THE NUMBER
   ========================================================= */
.n-art { display: grid; justify-items: center; gap: 16px; width: 100%; }
.n-art .big, .n-read .big {
  font-family: var(--font-round); font-weight: 800; line-height: .9; letter-spacing: -.055em; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, var(--brand-300) 0%, var(--brand) 55%, var(--brand-700) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.n-art .big { font-size: clamp(120px, 20vw, 260px); }
.n-art .cap { font-size: clamp(17px, 1.8vw, 21px); color: var(--ink-2); font-weight: 500; text-align: center; max-width: 24ch; }
.n-art .tape { width: min(100%, 420px); height: 54px; position: relative;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 1.5px, transparent 1.5px 14px) center 60% / 100% 18px no-repeat,
    repeating-linear-gradient(90deg, rgba(0,0,0,.5) 0 2px, transparent 2px 70px) center 60% / 100% 30px no-repeat;
  -webkit-mask: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); mask: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
  animation: tape 6s ease-in-out infinite alternate; }
@keyframes tape { to { background-position: -140px 60%, -140px 60%; } }
.n-round { display: grid; gap: clamp(10px, 2.2vh, 26px); justify-items: center; text-align: center; width: 100%; max-width: 900px; margin: 0 auto; }
.n-prompt { font-size: clamp(22px, min(3vw, 4.6vh), 38px); line-height: 1.15; font-weight: 700; letter-spacing: -.025em; max-width: 24ch; }
.n-read { display: grid; justify-items: center; gap: 2px; align-content: center; }
.n-read .big { font-size: clamp(84px, min(16vw, 22vh), 200px); transition: transform .2s var(--ease); }
.n-read .unit { font-size: clamp(17px, 2vw, 22px); font-weight: 600; color: var(--ink-2); }
.dial-wrap { width: 100%; max-width: 760px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.dial { position: relative; height: 104px; border-radius: 26px; background: #fff; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); overflow: hidden; touch-action: none; cursor: grab; }
.dial:active { cursor: grabbing; }
.dial canvas { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
.dial .needle { position: absolute; left: 50%; top: 12px; bottom: 12px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--brand); box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .15); }
.dial .needle::before { content: ''; position: absolute; top: -8px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--brand); box-shadow: 0 2px 6px rgba(var(--brand-rgb), .4); }
.dial .hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--ink-3); pointer-events: none; transition: opacity .4s; }
.step-btn { width: 56px; height: 56px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); display: grid; place-items: center; color: var(--ink); transition: transform .15s var(--ease); }
.step-btn:active { transform: scale(.9); }
.n-scale { width: 100%; max-width: 760px; display: grid; gap: 10px; }
.n-track { position: relative; height: 12px; border-radius: 6px; background: var(--fill); }
.n-gap { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: rgba(var(--brand-rgb), .22); transition: left 1s var(--ease), width 1s var(--ease); }
.n-dot { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid #fff; box-shadow: var(--shadow-2); transition: left 1.2s var(--ease); }
.n-dot.you { background: var(--ink); }
.n-dot.real { background: var(--brand); width: 28px; height: 28px; margin: -14px 0 0 -14px; }
.n-labels { position: relative; height: 22px; font-size: 13px; color: var(--ink-2); }
.n-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; font-weight: 600; transition: left 1.2s var(--ease); }
.n-labels span.real { color: var(--brand-text); }
.n-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.n-verdict { display: grid; gap: 6px; justify-items: center; }
.n-verdict .pts { font-family: var(--font-round); font-weight: 800; font-size: clamp(30px, 4vw, 44px); color: var(--good-ink); letter-spacing: -.02em; }
.n-verdict .ctx { font-size: clamp(17px, 1.8vw, 20px); color: var(--ink-2); max-width: 40ch; }
.n-compare { display: flex; gap: clamp(16px, 4vw, 48px); align-items: end; justify-content: center; }
.n-compare .col { display: grid; gap: 4px; justify-items: center; }
.n-compare .col span { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.n-compare .col b { font-family: var(--font-round); font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.n-compare .you b { font-size: clamp(40px, min(7vw, 10vh), 84px); color: var(--ink-3); }
.n-compare .real b { padding-inline: .08em; margin-inline: -.08em; font-size: clamp(72px, min(13vw, 19vh), 168px); background: linear-gradient(180deg, var(--brand-300), var(--brand) 55%, var(--brand-700)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.rounds-mini { display: grid; gap: 8px; width: 100%; }
.rounds-mini div { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 12px; align-items: center; font-size: 14px; }
.rounds-mini div span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.rounds-mini .bar { height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.rounds-mini .bar i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
.rounds-mini b { font-family: var(--font-round); text-align: right; font-variant-numeric: tabular-nums; }

/* =========================================================
   GAME: SPIN
   ========================================================= */
.wheel-box { position: relative; width: var(--wsz, 420px); height: var(--wsz, 420px); flex: none; }
.wheel-box svg.wheel, .mini-wheel svg.wheel { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.wheel-box svg.wheel-base, .mini-wheel svg.wheel-base { filter: drop-shadow(0 24px 40px rgba(0,0,0,.12)) drop-shadow(0 4px 10px rgba(0,0,0,.06)); }
.wheel-box svg.wheel-gloss, .mini-wheel svg.wheel-gloss { pointer-events: none; }
.wheel-spin { will-change: transform; }
.wheel-pointer { position: absolute; left: 50%; top: -14px; width: 44px; height: 54px; margin-left: -22px; z-index: 3; transform-origin: 50% 26%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.22)); }
.wheel-pointer.flick { animation: flick .18s var(--ease-out); }
@keyframes flick { 40% { transform: rotate(-16deg); } }
.wheel-hub { position: absolute; left: 50%; top: 50%; width: 24%; height: 24%; transform: translate(-50%, -50%); border-radius: 50%; background: #fff; display: grid; place-items: center; z-index: 2; box-shadow: 0 0 0 6px rgba(255,255,255,.6), var(--shadow-2); }
.wheel-hub .mark { width: 44%; height: 44%; }
.wheel-hub img { width: 70%; height: 70%; object-fit: contain; }
button.wheel-hub { cursor: pointer; transition: transform .2s var(--ease); }
button.wheel-hub:active { transform: translate(-50%, -50%) scale(.94); }
.wheel-hub .go { font-family: var(--font-round); font-weight: 800; color: var(--brand-text); font-size: clamp(14px, 1.8vw, 20px); letter-spacing: .02em; }
.wheel-box.spinning { cursor: default; }
.s-art .wheel-spin { animation: idle-spin 30s linear infinite; }
@keyframes idle-spin { to { transform: rotate(360deg); } }
.s-layout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
.s-panel { display: grid; gap: 18px; min-width: 0; }
.s-panel .qtext { text-align: left; font-size: clamp(24px, 2.8vw, 36px); max-width: none; }
.boost-meter { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.boost-meter .bolts { display: flex; gap: 6px; }
.boost-meter .bolt { width: 36px; height: 36px; border-radius: 11px; background: var(--fill-2); color: var(--ink-3); display: grid; place-items: center; transition: background .4s, color .4s, transform .5s var(--spring); }
.boost-meter .bolt.on { background: linear-gradient(145deg, #FFC74A, #FF9F0A); color: #fff; transform: scale(1.08); box-shadow: 0 6px 16px rgba(255, 159, 10, .35); }
.boost-meter span { font-size: 15px; color: var(--ink-2); font-weight: 500; }
.odds { background: #fff; border-radius: 22px; padding: 6px; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); display: grid; }
.odds-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 14px; transition: background .3s; }
.odds-row .ptile { --s: 32px; }
.odds-row .ptile.soft svg { filter: none; }
.odds-row .nm { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.odds-row .pc { font-family: var(--font-round); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; color: var(--ink-2); }
.odds-row.up { background: #FFF7E6; }
.odds-row.up .pc { color: var(--gold-ink); }
.odds-row.won { background: var(--brand-50); box-shadow: inset 0 0 0 2px var(--brand); }
.odds-head { display: flex; justify-content: space-between; padding: 8px 10px 4px; font-size: 13px; color: var(--ink-3); font-weight: 500; }
.prize-card { display: grid; gap: 14px; justify-items: start; animation: pop-in .6s var(--spring); }
.prize-card .ptile { --s: 84px; }
.prize-card h2 { font-size: clamp(34px, 4.4vw, 56px); line-height: 1.04; letter-spacing: -.035em; }
.prize-code { font-family: var(--font-mono); font-weight: 700; font-size: clamp(30px, 5vw, 48px); letter-spacing: .08em; padding: 14px 22px; border-radius: 18px; background: #fff; box-shadow: 0 0 0 1px var(--line), var(--shadow-1); border: 2px dashed var(--brand-200); }
.s-art { display: grid; place-items: center; }
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  .s-layout { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .s-panel { width: 100%; max-width: 620px; }
  .s-panel .qtext { text-align: center; }
  .boost-meter { justify-content: center; }
  .prize-card { justify-items: center; text-align: center; }
}

/* =========================================================
   GAME: RECALL
   ========================================================= */
.r-art { position: relative; width: min(100%, 440px); aspect-ratio: 1; }

/* =====================================================================
   Activate8 runtime: utilities, theme engine, sound, confetti, stage,
   lead capture, leaderboards. Games plug in through GAMES[id].
   ===================================================================== */

// ---------- utilities ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = (n, d = 0) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutQuint = (t) => 1 - Math.pow(1 - t, 5);
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const uid = () => Math.random().toString(36).slice(2, 10);
const initials = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map((p) => p[0] || '').join('').toUpperCase() || '?';
const bus = new EventTarget();
// Apple devices render SF Pro, which is already tight at display sizes; CSS eases tracking there.
if (/Mac|iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) document.documentElement.classList.add('apple');
const emit = (type, detail) => bus.dispatchEvent(new CustomEvent(type, { detail }));
const decimalsOf = (step) => { const s = String(step); return s.includes('.') ? s.split('.')[1].length : 0; };

function icon(name, size = 24, sw = 1.8, cls = '') {
  const p = ICONS[name];
  if (!p) { console.warn('[a8] missing icon', name); return ''; }
  return `<svg class="ic ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
function ptile(iconName, color, size = 64, extra = '') {
  const s = size == null ? '' : `;--s:${typeof size === 'number' ? size + 'px' : size}`;
  return `<span class="ptile ${extra}" style="--c:${esc(color || 'var(--brand)')}${s}">${icon(iconName, 24, 1.9)}</span>`;
}

// ---------- color + theme engine ----------
const Color = {
  hexToRgb(hex) {
    let h = String(hex || '').replace('#', '').trim();
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    if (!/^[0-9a-f]{6}$/i.test(h)) h = '2F6BFF';
    const n = parseInt(h, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  },
  hex({ r, g, b }) { return '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('').toUpperCase(); },
  mix(a, b, t) { return { r: lerp(a.r, b.r, t), g: lerp(a.g, b.g, t), b: lerp(a.b, b.b, t) }; },
  lum({ r, g, b }) { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); },
  contrast(a, b) { const l1 = Color.lum(a), l2 = Color.lum(b); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); },
};
const WHITE = { r: 255, g: 255, b: 255 }, BLACK = { r: 0, g: 0, b: 0 };
function themeFor(hex) {
  const c = Color.hexToRgb(hex);
  let text = c, i = 0;
  while (Color.contrast(text, WHITE) < 4.6 && i++ < 24) text = Color.mix(text, BLACK, 0.08);
  return {
    '--brand': Color.hex(c),
    '--brand-rgb': `${c.r}, ${c.g}, ${c.b}`,
    '--brand-50': Color.hex(Color.mix(c, WHITE, 0.93)),
    '--brand-100': Color.hex(Color.mix(c, WHITE, 0.86)),
    '--brand-200': Color.hex(Color.mix(c, WHITE, 0.7)),
    '--brand-300': Color.hex(Color.mix(c, WHITE, 0.45)),
    '--brand-600': Color.hex(Color.mix(c, BLACK, 0.12)),
    '--brand-700': Color.hex(Color.mix(c, BLACK, 0.3)),
    '--brand-text': Color.hex(text),
    '--on-brand': Color.contrast(c, WHITE) >= 2.6 ? '#FFFFFF' : '#1D1D1F',
  };
}
function applyTheme(hex, el = document.documentElement) {
  const t = themeFor(hex);
  for (const k in t) el.style.setProperty(k, t[k]);
  return t;
}

// ---------- sound (synthesized, no files) ----------
const Sound = {
  ctx: null, on: true, master: null,
  ensure() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);

// ---------- confetti ----------
function burstConfetti(canvas, opts = {}) {
  if (!canvas || REDUCED) return () => {};
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const colors = opts.colors || [css.getPropertyValue('--brand').trim(), css.getPropertyValue('--brand-300').trim(), css.getPropertyValue('--brand-700').trim(), '#FFB340', '#FFFFFF', '#34C759'];
  const N = opts.count || (W < 600 ? 110 : 170);
  const parts = [];
  const ox = opts.x ?? W / 2, oy = opts.y ?? H * 0.42;
  for (let i = 0; i < N; i++) {
    const a = rand(-Math.PI * 0.92, -Math.PI * 0.08), s = rand(7, Math.min(22, H / 38));
    parts.push({ x: ox + rand(-30, 30), y: oy, vx: Math.cos(a) * s * rand(0.6, 1.3), vy: Math.sin(a) * s, w: rand(6, 10), h: rand(9, 15), r: rand(0, 6.3), vr: rand(-0.25, 0.25), c: colors[i % colors.length], circle: Math.random() < 0.28, life: 0, ttl: rand(120, 190), wob: rand(0, 6.3) });
  }
  let raf;
  const step = () => {
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts) {
      if (++p.life > p.ttl) continue;
      alive++;
      p.vx *= 0.986; p.vy = p.vy * 0.986 + 0.3; p.x += p.vx + Math.sin(p.life * 0.08 + p.wob) * 0.6; p.y += p.vy; p.r += p.vr;
      ctx.globalAlpha = Math.min(1, (p.ttl - p.life) / 34);
      ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.circle) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2.2, 0, Math.PI * 2); ctx.fill(); }
      else { ctx.scale(1, Math.cos(p.life * 0.14 + p.wob)); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      if (p.c === '#FFFFFF') { ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1; ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (alive) raf = requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  };
  step();
  return () => { cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); };
}

function markSVG(brand, cls = 'mark') {

}
function logoHTML(brand, size = '') {
  // Single-game (platform) pages have no brand name: with no uploaded logo the
  // top bar stays empty rather than showing a "Your Brand" placeholder.
  if (brand.id === 'custom' && !brand.logoImg && !brand.nameSet && document.body.classList.contains('a8-single')) return '';

}

// ---------- sheets ----------
function openSheet({ html, cls = '', host = document.body, dismissable = true, onClose, label = 'Dialog' }) {
  const layer = document.createElement('div');
  layer.className = 'sheet-layer';
  layer.innerHTML = `<div class="sheet-backdrop"></div><div class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="sheet-grab"></div>${html}</div>`;
  host.appendChild(layer);

}

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const DOMAINS = ['gmail.com', 'outlook.com', 'yahoo.com', 'icloud.com', 'hotmail.com'];

function leadSheet(stage, opts) {
  const b = stage.brand, cfg = b.lead || {};
  const fields = cfg.fields || [
    { key: 'firstName', label: 'First name', required: true, half: true, autocomplete: 'given-name' },
    { key: 'lastName', label: 'Last name', half: true, autocomplete: 'family-name' },

    if (f.type === 'email') h += `<div class="domains" hidden>${DOMAINS.map((d) => `<button type="button" data-d="${d}">@${d}</button>`).join('')}</div>`;
    return h;
  };
  let body = '', i = 0;
  while (i < fields.length) {
    const f = fields[i];
    if (f.half && fields[i + 1] && fields[i + 1].half) { body += `<div class="frow">${fieldHTML(f)}${fieldHTML(fields[i + 1])}</div>`; i += 2; }

  }
  const optLabel = resolveText(cfg.optInLabel || 'Send me news and offers from {brand}', b);
  const fine = `We use your details to send ${esc(opts.sends || 'your result')} and, if you opt in, updates from ${esc(b.name)}. ${esc(b.name)}’s privacy policy applies. Unsubscribe anytime.`;
  const html = `
    <button type="button" class="icon-btn sheet-close" data-leave aria-label="Leave this game">${icon('x', 20)}</button>
    <div class="sheet-head">${opts.tile || ''}<h2>${esc(opts.title)}</h2>${opts.sub ? `<p>${esc(opts.sub)}</p>` : ''}</div>
    <form class="lead-form" novalidate>
      ${body}
      <label class="toggle-row" for="lf-optin"><span>${esc(optLabel)}</span><input id="lf-optin" type="checkbox" class="switch"${cfg.optInDefault ? ' checked' : ''}></label>
      <button class="btn btn-primary btn-block" type="submit">${esc(opts.cta || 'Continue')}${icon('arrow-right', 20, 2.2)}</button>
      ${opts.allowSkip ? '<button type="button" class="btn btn-ghost" data-skip>Skip for now</button>' : ''}
      <p class="fine">${fine}</p>
    </form>`;

  return new Promise((resolve) => {
    stage.$screens.classList.toggle('dim', !!opts.dim);
    const sh = openSheet({ html, host: stage.el, dismissable: false, label: opts.title });
    stage.sheet = sh;
    $('[data-leave]', sh.el).addEventListener('click', () => { Sound.tap(); stage.attract(); });
    const form = $('form', sh.el);
    const email = $('#lf-email', sh.el), doms = $('.domains', sh.el);
    if (email && doms) {
      const sync = () => {
        const v = email.value; const at = v.indexOf('@');
        const show = v.length > 0 && (at === -1 || !v.slice(at + 1).includes('.'));
        doms.hidden = !show;
        if (show && at > -1) { const part = v.slice(at + 1).toLowerCase(); $$('button', doms).forEach((btn) => { btn.hidden = !btn.dataset.d.startsWith(part); }); }
        else $$('button', doms).forEach((btn) => { btn.hidden = false; });
      };
      email.addEventListener('input', sync);
      doms.addEventListener('click', (e) => {
        const btn = e.target.closest('button'); if (!btn) return;
        const local = email.value.split('@')[0];

        clearErr(email.closest('.field'));

    }));
    const clearErr = (fieldEl) => { if (!fieldEl) return; fieldEl.classList.remove('invalid'); const n = $('.ferr', fieldEl); if (n) n.remove(); };
    const setErr = (fieldEl, msg) => { fieldEl.classList.add('invalid'); const n = $('.ferr', fieldEl); if (n) n.remove(); fieldEl.insertAdjacentHTML('beforeend', `<span class="ferr" role="alert">${icon('circle-x', 14, 2)}${esc(msg)}</span>`); };

    const finish = (lead) => {

    const skip = $('[data-skip]', sh.el);
    if (skip) skip.addEventListener('click', () => { Sound.tap(); finish(null); });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {}; let firstBad = null;
      for (const f of fields) {
        if (f.choices) {
          const sel = $(`.choice[data-key="${f.key}"] [aria-pressed="true"]`, sh.el);
          data[f.key] = sel ? sel.dataset.v : '';

        }
        const input = $(`#lf-${f.key}`, sh.el), wrap = input.closest('.field');
        const v = input.value.trim(); data[f.key] = v;
        let msg = '';

        else if (v && f.type === 'email' && !EMAIL_RE.test(v)) msg = 'That email looks incomplete. Check for a typo.';
        else if (v && f.type === 'zip' && !/^\d{5}$/.test(v)) msg = 'Use a 5-digit ZIP code.';
        if (msg) { setErr(wrap, msg); firstBad = firstBad || input; } else clearErr(wrap);
      }
      if (firstBad) { Sound.wrong(); firstBad.focus(); return; }
      data.optIn = $('#lf-optin', sh.el).checked;
      Sound.select();
      finish(data);
    });
  });
}

// ---------- stage (one game at a time, full screen) ----------
class Stage {
  constructor(app) {
    this.app = app; this.el = null; this.timers = new Set(); this.intervals = new Set(); this.rafs = new Set();
    this.lastActive = Date.now(); this.sheet = null; this.idleSheet = null; this.mode = 'off';
    this.onKey = (e) => {
