  }
  get kiosk() { return this.app.kiosk; }

  open(gameId) {
    this.app.persist();
    const brand = this.app.brand;
    this.brand = brand; this.gameId = gameId; this.game = GAMES[gameId];
    this.content = resolveText(brand.games[gameId], brand);
    this.products = resolveText(brand.products || {}, brand);
    const el = document.createElement('div');
    el.className = 'stage';
    el.innerHTML = `
      <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
      <header class="topbar">
        <div class="tb-left">${logoHTML(brand)}</div>
        <div class="tb-center" aria-live="polite"></div>
        <div class="tb-right">
          <button class="icon-btn" data-act="sound" aria-label="Sound on or off">${icon(Sound.on ? 'volume-2' : 'volume-x', 20)}</button>
          ${document.fullscreenEnabled ? `<button class="icon-btn" data-act="fs" aria-label="Full screen">${icon('maximize', 18)}</button>` : ''}
          <button class="icon-btn" data-act="exit" aria-label="Back to the library">${icon('x', 20)}</button>
        </div>
      </header>
      <div class="screens"></div>
      <div class="toast-host"></div>
      <canvas class="confetti" aria-hidden="true"></canvas>`;
    document.body.appendChild(el);
    document.body.classList.add('stage-open');
    this.el = el; this.$screens = $('.screens', el); this.$top = $('.tb-center', el);
    el.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]'); if (!btn || !el.contains(btn)) return;
      const act = btn.dataset.act;
      if (act === 'sound') { Sound.on = !Sound.on; btn.innerHTML = icon(Sound.on ? 'volume-2' : 'volume-x', 20); if (Sound.on) Sound.tap(); }
      if (act === 'fs') this.toggleFullscreen();
      if (act === 'exit') this.close();
    });
    ['pointerdown', 'keydown', 'touchstart'].forEach((t) => el.addEventListener(t, this.onActivity, { passive: true }));
    document.addEventListener('keydown', this.onKey);
    this.idleLoop = setInterval(() => this.checkIdle(), 1000);
    this.attract();
  }

  close() {
    if (!this.el) return;
    this.clear();
    clearInterval(this.idleLoop);
    document.removeEventListener('keydown', this.onKey);
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    const el = this.el; this.el = null; this.mode = 'off';
    el.style.transition = 'opacity .3s ease'; el.style.opacity = '0';
    setTimeout(() => el.remove(), 300);
    document.body.classList.remove('stage-open');
    this.app.onStageClosed();
  }

  toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(() => this.toast(`${icon('info', 20)}<span>Full screen isn’t available in this view.</span>`));
    } catch (e) { /* optional */ }
  }

  // tracked async helpers: when the stage resets, pending work simply never resumes
  clear() {
    this.timers.forEach(clearTimeout); this.timers.clear();
    this.intervals.forEach(clearInterval); this.intervals.clear();
    this.rafs.forEach(cancelAnimationFrame); this.rafs.clear();
    if (this.stopConfetti) { this.stopConfetti(); this.stopConfetti = null; }
    if (this.sheet) { this.sheet.close('reset'); this.sheet = null; }
    if (this.idleSheet) { this.idleSheet.close('reset'); this.idleSheet = null; }
    if (this.$screens) this.$screens.classList.remove('dim');
    if (this.game && this.game.cleanup) this.game.cleanup(this);
    this.epoch = (this.epoch || 0) + 1;
  }
  after(ms, fn) { const id = setTimeout(() => { this.timers.delete(id); fn(); }, ms); this.timers.add(id); return id; }
  every(ms, fn) { const id = setInterval(fn, ms); this.intervals.add(id); return id; }
  stopEvery(id) { clearInterval(id); this.intervals.delete(id); }
  wait(ms) { return new Promise((r) => this.after(ms, r)); }
  frame(fn) { const id = requestAnimationFrame((t) => { this.rafs.delete(id); fn(t); }); this.rafs.add(id); return id; }
  tween(ms, fn, ease = easeOutCubic) {
    return new Promise((resolve) => {
      const t0 = performance.now();

      this.frame(step);
    });
  }
  live(epoch) { return this.el && this.epoch === epoch; }

  screen(html, cls = '', after = '') {
    const host = this.$screens;
    const old = $$('.screen', host).filter((s) => !s.classList.contains('leave'));
    const el = document.createElement('section');
    el.className = `screen ${cls}`;
    el.innerHTML = `<div class="inner">${html}</div>${after}`;
    const born = performance.now();
    el.addEventListener('click', (e) => { if (performance.now() - born < 340) { e.stopPropagation(); e.preventDefault(); } }, true);
    host.appendChild(el);
    void el.offsetWidth;
    el.classList.add('active');
    old.forEach((o) => { o.classList.remove('active'); o.classList.add('leave'); setTimeout(() => o.remove(), 450); });
    return el;
  }
  top(html) { if (this.$top) this.$top.innerHTML = html; }
  capsules(i, n) { this.top(`<div class="capsules" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${i}">${Array.from({ length: n }, (_, k) => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('')}</div>`); }

  toast(html, ms = 2400) {
    const host = $('.toast-host', this.el); if (!host) return;
    host.innerHTML = '';
    const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; host.appendChild(t);
    this.after(ms, () => { t.classList.add('out'); this.after(360, () => t.remove()); });
  }
  floater(text, anchor, color) {
    if (!anchor || !this.el) return;
    const r = anchor.getBoundingClientRect(), sr = this.el.getBoundingClientRect();
    const f = document.createElement('div'); f.className = 'floater'; f.textContent = text;
    if (color) f.style.color = color;
    f.style.left = `${r.left - sr.left + r.width / 2}px`; f.style.top = `${r.top - sr.top - 6}px`;
    this.el.appendChild(f); setTimeout(() => f.remove(), 1200);
  }
  confetti(opts) { if (this.stopConfetti) this.stopConfetti(); this.stopConfetti = burstConfetti($('canvas.confetti', this.el), opts); }

  async countdown() {
    const ep = this.epoch;
    for (const n of ['3', '2', '1']) {
      if (!this.live(ep)) return;
      this.screen(`<div class="countdown"><b>${n}</b></div>`, 'quick');
      Sound.count(false);
      await this.wait(760);
    }
    if (!this.live(ep)) return;
    this.screen(`<div class="countdown"><b class="go">Go</b></div>`, 'quick');
    Sound.count(true);
    await this.wait(520);
  }

  // ----- flow -----
  attract() {
    this.clear(); this.mode = 'attract'; this.top('');
    this.el.classList.remove('quiet');
    const c = this.content, g = this.game, b = this.brand;
    const meta = (c.meta || []).map((m) => `<span>${icon(m.icon, 18, 2)}${esc(m.text)}</span>`).join('');
    const prize = c.prize ? `<div class="prize-line">${ptile(c.prize.icon || 'gift', c.prize.color || 'var(--brand)', 30)}${esc(c.prize.text)}</div>` : '';
    const el = this.screen(`
      <div class="attract">
        <div class="attract-copy">
          <div class="eyebrow">${esc(c.eyebrow)}</div>
          <h1 class="t-hero">${esc(c.title)}</h1>
          <p class="t-sub">${esc(c.subtitle)}</p>
          ${prize}
          <div class="attract-cta"><button class="btn btn-primary btn-xl" data-start>${esc(c.cta || 'Start')}${icon('arrow-right', 22, 2.2)}</button></div>
          <div class="meta-row">${meta}</div>
        </div>
        <div class="attract-art">${g.art(this)}</div>
      </div>`, 'is-attract', '<div class="powered">Powered by <b>Activate8</b></div>');
    $('[data-start]', el).addEventListener('click', () => { Sound.ensure(); Sound.select(); this.play(); });
    if (g.afterArt) g.afterArt(this, el);
  }
  play() {
    this.clear(); this.mode = 'play'; this.lastActive = Date.now();
    this.el.classList.add('quiet');
    this.game.play(this);
  }
  lead(opts) {
    this.mode = 'lead';
    return leadSheet(this, opts).then((data) => { this.mode = 'play'; return data; });
  }
  saveLead(data, extra) {
    if (!data) return null;
    const lead = { id: uid(), ts: new Date().toISOString(), brand: this.brand.name, game: this.game.name, ...data, ...extra };
    Leads.add(lead);
    return lead;
  }
  code() { return `${this.brand.code || 'A8'}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`; }
  takeHome(title, sub, code) {
    const url = `${(this.brand.url || 'https://activate.requisor.io').replace(/\/$/, '')}/?r=${code}`;
    return `<div class="takehome"><div class="qr"><canvas data-qr="${esc(url)}" width="164" height="164"></canvas></div><div><b>${esc(title)}</b><span>${esc(sub)}</span><code>${esc(url.replace(/^https?:\/\//, ''))}</code></div></div>`;
  }
  mountQR(root) { $$('canvas[data-qr]', root).forEach((cv) => renderQR(cv, cv.dataset.qr)); }
  resultActions(primary = 'Done') {
    return `<div class="result-actions">
      <button class="btn btn-secondary btn-lg" data-again>${icon('rotate-ccw', 20, 2)}Play again</button>
      <button class="btn btn-primary btn-lg" data-done>${esc(primary)}</button>
    </div>
    <div class="reset-note" data-reset ${this.kiosk ? '' : 'hidden'}><span class="mini-ring"></span><span data-reset-text>Back to the start in 30s</span><button type="button" data-stay>Stay here</button></div>`;
  }
  bindResult(el) {
    this.mode = 'result';
    this.mountQR(el);
    $('[data-again]', el).addEventListener('click', () => { Sound.tap(); this.play(); });
    $('[data-done]', el).addEventListener('click', () => { Sound.tap(); this.attract(); });
    const note = $('[data-reset]', el);
    if (this.kiosk && note) {
      const total = 30; let left = total;
      const ring = $('.mini-ring', note), txt = $('[data-reset-text]', note);
      const id = this.every(1000, () => {
        left -= 1;
        ring.style.setProperty('--p', String(left / total));
        txt.textContent = `Back to the start in ${left}s`;
        if (left <= 0) { this.stopEvery(id); this.attract(); }
      });
      $('[data-stay]', note).addEventListener('click', () => { this.stopEvery(id); this.mode = 'hold'; this.lastActive = Date.now(); note.innerHTML = `${icon('check', 16, 2.4)}<span>Paused. Resets after 75 seconds without a tap.</span>`; });
    }
  }
  checkIdle() {
    if (!this.el || !this.kiosk || this.idleSheet) return;
    if (this.mode !== 'play' && this.mode !== 'lead' && this.mode !== 'hold') return;
    if (Date.now() - this.lastActive < 75000) return;
    let left = 10;
    const sh = openSheet({
      host: this.el, dismissable: false, label: 'Still playing?',
      html: `<div class="sheet-head"><div class="idle-ring" style="--p:1"><b>${left}</b></div><h2>Still playing?</h2><p>This game resets for the next player when the timer runs out.</p></div><button class="btn btn-primary btn-block btn-lg" data-keep>Keep playing</button>`,
    });
    this.idleSheet = sh;
    const ring = $('.idle-ring', sh.el), num = $('b', ring);
    const id = setInterval(() => {
      left -= 1; ring.style.setProperty('--p', String(left / 10)); num.textContent = left;
      if (left <= 0) { clearInterval(id); this.idleSheet = null; sh.close(); this.attract(); }
    }, 1000);
    $('[data-keep]', sh.el).addEventListener('click', () => { clearInterval(id); this.idleSheet = null; this.lastActive = Date.now(); sh.close(); Sound.tap(); });
  }
}

// Shared quiz helper: renders answers, resolves {index, correct} after feedback.
function answersHTML(options, cls = '') {
  return `<div class="answers ${cls}">${options.map((o, i) => `<button class="answer" data-i="${i}" style="animation-delay:${80 + i * 60}ms"><span class="key">${'ABCD'[i]}</span><span>${esc(o)}</span><span class="mark"></span></button>`).join('')}</div>`;
}
function bindAnswers(stage, root, correctIndex, onPick) {
  const wrap = $('.answers', root);
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.answer'); if (!btn || wrap.classList.contains('locked')) return;
    wrap.classList.add('locked');
    const i = Number(btn.dataset.i), ok = i === correctIndex;
    const right = $(`.answer[data-i="${correctIndex}"]`, wrap);
    right.classList.add('correct'); $('.mark', right).innerHTML = icon('check', 18, 3);
    if (!ok) { btn.classList.add('wrong'); $('.mark', btn).innerHTML = icon('x', 18, 3); Sound.wrong(); }
    else Sound.correct();
    onPick(i, ok, btn);
  });
}

// A tactile ruler dial: drag or flick the tape under a fixed needle.
class Dial {
  constructor(root, { min, max, step, value, onChange, onTick }) {
    Object.assign(this, { root, min, max, step, value, onChange, onTick });
    this.canvas = $('canvas', root);
    this.ctx = this.canvas.getContext('2d');
    this.dec = decimalsOf(step);
    const steps = (max - min) / step;
    this.px = clamp(2200 / steps, 7, 24);
    const nice = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000];
    this.major = nice.find((n) => n * this.px >= 84) || 1000;
    this.v = 0; this.drag = null; this.anim = null; this.lastStep = this.snap(value);
    this.resize = this.resize.bind(this);
    window.addEventListener('resize', this.resize);
    this.bind(); this.resize();
  }
  snap(v) { return Number((Math.round((v - this.min) / this.step) * this.step + this.min).toFixed(this.dec)); }
  set(v, fromUser = true) {
    this.value = clamp(v, this.min, this.max);
    const s = this.snap(this.value);
    if (s !== this.lastStep) { this.lastStep = s; if (fromUser && this.onTick) this.onTick(); this.onChange(s); }
    this.draw();
  }
  get snapped() { return this.snap(this.value); }
  resize() {
    const r = this.root.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = r.width; this.h = r.height;
    this.canvas.width = Math.round(r.width * dpr); this.canvas.height = Math.round(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.draw();
  }
  draw() {
    const { ctx, w, h, px, step, min, max } = this;
    if (!w) return;
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, first = Math.max(0, Math.floor((this.value - min) / step - cx / px) - 1);
    const last = Math.min(Math.round((max - min) / step), Math.ceil((this.value - min) / step + cx / px) + 1);
    const base = h * 0.66;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = `600 13px -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif`;
    const mUnit = this.major * step, onGrid = (v, u) => Math.abs(v / u - Math.round(v / u)) < 1e-6;

      const isMajor = onGrid(v, mUnit), isMid = !isMajor && this.major % 2 === 0 && onGrid(v, mUnit / 2);
      const len = isMajor ? 30 : isMid ? 20 : 12;
      ctx.fillStyle = isMajor ? 'rgba(29,29,31,.62)' : 'rgba(29,29,31,.24)';
      const bw = isMajor ? 2 : 1.4;
      ctx.fillRect(Math.round(x - bw / 2), base - len, bw, len);
      if (isMajor) { ctx.fillStyle = 'rgba(29,29,31,.5)'; ctx.fillText(fmt(Number(v.toFixed(this.dec)), this.dec), x, base + 20); }
    }
  }
  bind() {
    const el = this.root;
    el.addEventListener('pointerdown', (e) => {
      cancelAnimationFrame(this.anim); el.setPointerCapture(e.pointerId);
      this.drag = { x: e.clientX, t: performance.now(), v: 0 };

    });

      if (!this.drag) return;
      let v = this.drag.v; this.drag = null;
      let prev = performance.now();

        const dt = now - prev; prev = now;
        v *= Math.pow(0.94, dt / 16);
        this.set(this.value - (v * dt / this.px) * this.step);
        if (Math.abs(v) > 0.02 && this.value > this.min && this.value < this.max) this.anim = requestAnimationFrame(glide);
        else this.settle();
      };
      if (Math.abs(v) > 0.05) this.anim = requestAnimationFrame(glide); else this.settle();
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('keydown', (e) => {

}

          <button class="mcard up" data-i="${i}" data-id="${esc(p.id)}" style="animation-delay:${i * 40}ms" aria-label="Card ${i + 1}">
            <span class="in">
              <span class="mface mback"><span class="badge-mark">${hubInner(stage.brand)}</span></span>
              <span class="mface mfront">${cardPic(p, null)}<b>${esc(p.title)}</b></span>
            </span>
            <span class="tick">${icon('check', 14, 3)}</span>
          </button>`).join('')}</div>
      </div>`, 'has-toast');
    const grid = $('.mgrid', el), head = $('[data-head]', el), sub = $('[data-sub]', el);
    const fit = () => {
      const W = stage.el.clientWidth, H = stage.el.clientHeight;
      const wide = W / H >= 1.05;
      const cols = wide ? 4 : 3, rows = wide ? 3 : 4, gap = W < 500 ? 10 : 14;
      const phone = W <= 640;
      const availW = Math.min(W - 40, 1000), availH = H - (phone ? 120 : 84) - 120 - (phone ? 40 : 100);
      const size = Math.floor(Math.min((availW - gap * (cols - 1)) / cols, (availH - gap * (rows - 1)) / rows, 200));
      grid.style.setProperty('--cols', cols); grid.style.setProperty('--card', `${Math.max(64, size)}px`); grid.style.setProperty('--gap', `${gap}px`);
      $$('.mcard', grid).forEach((m) => m.classList.toggle('small', size < 128));
    };
    fit(); stage._fit = fit; window.addEventListener('resize', fit);

    // Preview: every feature face up, then shuffle face down.
    await stage.wait(2600);
    if (!stage.live(ep)) return;
    $$('.mcard', grid).forEach((m, i) => stage.after(i * 35, () => m.classList.remove('up')));
    Sound.whoosh();
    await stage.wait(700);
    if (!stage.live(ep)) return;
    head.textContent = 'Find the pairs.'; sub.textContent = 'Tap two cards. Match all six as fast as you can.';
    lock = false; t0 = performance.now();
    timerId = stage.every(250, () => { secs = Math.floor((performance.now() - t0) / 1000); $time.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`; });

    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.mcard');
      if (!card || lock || card.classList.contains('up')) return;
      card.classList.add('up'); Sound.tap();
      if (!first) { first = card; return; }
      const a = first, b = card; first = null; moves++; $moves.textContent = moves;
      if (a.dataset.id === b.dataset.id) {
        a.classList.add('matched'); b.classList.add('matched'); found++; $found.textContent = found;
        const p = pairs.find((x) => x.id === a.dataset.id);
        Sound.correct();
        stage.toast(`${cardPic(p, 34)}<span><b>${esc(p.title)}</b></span>`, 2000);
        if (found === pairs.length) {
          stage.stopEvery(timerId); lock = true;
          const final = Math.max(1, Math.floor((performance.now() - t0) / 1000));
          $time.textContent = `${Math.floor(final / 60)}:${String(final % 60).padStart(2, '0')}`;
          stage.after(900, () => recallRound(final));
        }
      } else {
        lock = true;
        stage.after(380, () => { a.classList.add('miss'); b.classList.add('miss'); });
        stage.after(950, () => { a.classList.remove('up', 'miss'); b.classList.remove('up', 'miss'); lock = false; });
      }
    });

    const recallRound = async (elapsed) => {
      const clock = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, '0')}`;
      stage.screen(`<div class="bigword"><h2>All six.</h2><p class="t-sub">Found in ${clock} with ${moves} moves.</p></div>`);
      Sound.win();
      await stage.wait(1800);
      if (!stage.live(ep)) return;
      stage.top('');
      // Memory only: a faster finish and fewer moves score higher. Scaled so it sits on the same range as the seeded leaderboard.
      const memory = Math.max(300, 1500 - Math.max(0, elapsed - 20) * 12 - Math.max(0, moves - 6) * 20);
      const score = Math.round(memory * 1.8);
      const data = await stage.lead({ ...c.lead, allowSkip: true, tile: ptile('brain', 'var(--brand)', 56) });
      if (!stage.live(ep)) return;
      const code = stage.code();
      const lead = stage.saveLead(data, { result: `Matched all ${pairs.length} pairs in ${clock}`, score, code });
      const key = `${stage.brand.id}:recall`;
      const list = Boards.get(key, c.seed || []);
      let rank = null, meId = null;
      if (lead) { const me = { id: uid(), name: `${lead.firstName} ${lead.lastName ? lead.lastName[0] + '.' : ''}`.trim(), score }; meId = me.id; rank = Boards.add(key, me); }
      const res = stage.screen(`
        <div class="result split">
          <div class="result-main">
            <div class="result-head">
              <div class="eyebrow">${lead ? `Great memory, ${esc(lead.firstName)}.` : 'Great memory.'}</div>
              <div class="result-score" data-count>0<small>pts</small></div>
              <p class="t-sub">${rank ? (rank === 1 ? 'Top score today.' : `You’re #${rank} of ${list.length} players today.`) : `You matched all ${pairs.length} cards in ${moves} moves.`}</p>
            </div>
            <div class="stats" style="--n:3">
              <div class="stat"><b>${clock}</b><span>Time</span></div>
              <div class="stat"><b>${moves}</b><span>Moves</span></div>
              <div class="stat"><b>${pairs.length}/${pairs.length}</b><span>Pairs</span></div>
            </div>
            ${stage.takeHome(c.takeHome.title, c.takeHome.sub, code)}
            ${stage.resultActions()}
          </div>
          <div class="result-side">${boardHTML(list, meId)}</div>
        </div>`);
      const counter = $('[data-count]', res);
      stage.tween(1200, (k) => { counter.firstChild.nodeValue = fmt(Math.round(score * k)); });
      if (moves <= pairs.length + 3 || (rank && rank <= 3)) { Sound.win(); stage.confetti(); } else Sound.correct();
      stage.bindResult(res);
    };
  },
};

      </div>`).join('');
    const empty = `<div class="empty">${ptile('users', 'var(--brand)', 52)}<b>No leads yet</b><span>Play any game and finish its lead form. The record shows up here with the player’s score or result.</span></div>`;
    const sh = openSheet({
      cls: 'wide', label: 'Session leads',
      html: `<button class="icon-btn sheet-close" data-close aria-label="Close">${icon('x', 20)}</button>
        <div class="sheet-head"><h2>Session leads</h2><p>Players who finished a game in this preview. They’re kept in memory only and clear when this page reloads.</p></div>
        <div class="lead-list">${rows || empty}</div>
        <div class="result-actions">${L.length ? `<button class="btn btn-secondary" data-copy>${icon('copy', 18, 2)}Copy as CSV</button>` : ''}<button class="btn btn-ink" data-close>Done</button></div>
        <div class="csv-fallback" hidden><p class="t-foot">Copying isn’t available here. Select the text below and copy it.</p><textarea readonly rows="6" aria-label="Leads as CSV"></textarea></div>`,
    });
    $$('[data-close]', sh.el).forEach((b) => b.addEventListener('click', () => sh.close()));
    const copy = $('[data-copy]', sh.el);
    if (copy) copy.addEventListener('click', () => {
      const text = this.csv();
      const fallback = () => { const fb = $('.csv-fallback', sh.el); fb.hidden = false; const ta = $('textarea', fb); ta.value = text; ta.focus(); ta.select(); };
      try {
        navigator.clipboard.writeText(text).then(() => { copy.innerHTML = `${icon('check', 18, 2.4)}Copied ${L.length} lead${L.length > 1 ? 's' : ''}`; Sound.tap(); }, fallback);
      } catch (e) { fallback(); }
    });
  },
};

// Integration surface for the platform team: window.Activate8 exposes the brand kits,
// game registry and session leads; set window.A8_ON_LEAD = (lead) => {...} to receive
// each lead as it is captured.
window.Activate8 = { App, BRANDS, GAMES, Leads, Boards };

// Boot (keeps the brand kit and session leads across live updates of this page)
(function boot() {
  const hot = window.claude && window.claude.hot;
  const start = (data) => App.init(data || {});
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(() => ({ brandId: App.brandId, customBase: App.customBase, kiosk: App.kiosk, custom: App.custom, leads: Leads.list })); } catch (e) { /* optional */ }
  }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start(hot && hot.data);
})();

})();</script>

<style>
body.a8-single #app { display: none; }
body.a8-single .stage [data-act="exit"] { display: none; }
body.a8-single .stage .topbar .logo img { height: 48px; max-width: 240px; }
.a8-save-status { position:fixed; left:16px; right:16px; bottom:16px; z-index:10000; padding:12px 16px; border-radius:12px; background:#fff; color:#1a1a1a; box-shadow:0 4px 24px #0003; font:14px system-ui; }
.a8-save-status button { margin-left:12px; padding:8px 12px; border:1px solid #555; border-radius:8px; background:#fff; color:#111; cursor:pointer; }
</style>
<script>
(function(){// Shared by the editor, API, and standalone games. No uploaded code is executed.
const QUESTION_GAME_SLUGS = ["a8-match", "a8-trivia-rush", "a8-the-number", "a8-spin-to-win", "a8-recall", "jeopardy"];
const MATCH_RESULTS = ["Aura", "Terra", "Vela", "Nomad"];

// A memory card's own picture: an uploaded PNG, JPG, WebP or GIF kept as a
// base64 data URL. The editor shrinks uploads first; this caps what is accepted.
const CARD_IMAGE_MAX_CHARS = 700000;
const CARD_IMAGE = /^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/;

/** @returns {{ok: true, content: any} | {ok: false, error: string}} */
function validateGameContent(input, slug) {
  try {
    const fail = (message) => { throw new Error(message); };
    if (!QUESTION_GAME_SLUGS.includes(slug)) fail("This game does not support custom questions.");
    if (!input || typeof input !== "object" || Array.isArray(input) || input.gameSlug !== slug) fail("The question file belongs to a different game.");
    // Recall is memory cards only. It has no questions (older saved content may still carry some; they are ignored).
    const isRecall = slug === "a8-recall";
    const rawQuestions = isRecall ? [] : input.questions;
    if (!Array.isArray(rawQuestions) || (!isRecall && rawQuestions.length < 1) || rawQuestions.length > 50) fail("Add between 1 and 50 questions.");
    const text = (value, label, max = 500, optional = false) => {
      if (optional && (value === undefined || value === "")) return "";
      if (typeof value !== "string" || !value.trim() || value.length > max) fail(`${label} must contain 1–${max} characters.`);
      return value.trim();
    };
    const number = (value, label, integer = false) => {
      if (typeof value !== "number" || !Number.isFinite(value) || Math.abs(value) > 1e9 || (integer && !Number.isInteger(value))) fail(`${label} must be a valid ${integer ? "whole " : ""}number.`);
      return value;
    };
    const questions = rawQuestions.map((q, index) => {
      const label = `Question ${index + 1}`;
      if (!q || typeof q !== "object" || Array.isArray(q)) fail(`${label} is not an object.`);
      const clean = { text: text(q.text, label), explanation: text(q.explanation, `${label}: explanation`, 1000, true) };
      if (slug === "a8-the-number") {
        for (const key of ["answer", "min", "max", "step"]) clean[key] = number(q[key], `${label}: ${key}`);
        if (clean.max <= clean.min || clean.answer < clean.min || clean.answer > clean.max) fail(`${label}: answer must be inside a non-empty minimum/maximum range.`);
        if (clean.step < 0.001 || clean.step > clean.max - clean.min || (clean.max - clean.min) / clean.step > 100000) fail(`${label}: step must be at least 0.001 and produce no more than 100,000 dial positions.`);
        const steps = (clean.answer - clean.min) / clean.step;
        const rangeSteps = (clean.max - clean.min) / clean.step;
        if (Math.abs(steps - Math.round(steps)) > 0.00001 || Math.abs(rangeSteps - Math.round(rangeSteps)) > 0.00001) fail(`${label}: answer and maximum must align with the dial step.`);
        clean.unit = text(q.unit, `${label}: unit`, 40, true);
      } else {
        if (!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 4) fail(`${label}: provide 2–4 answer choices.`);
        clean.options = q.options.map((option, i) => text(option, `${label}: answer ${i + 1}`, 200));
        if (new Set(clean.options.map((o) => o.toLowerCase())).size !== clean.options.length) fail(`${label}: answer choices must be different.`);
        if (slug === "a8-match") {
          if (!Array.isArray(q.outcomes) || q.outcomes.length !== clean.options.length || q.outcomes.some((v) => !Number.isInteger(v) || v < 0 || v > 3)) fail(`${label}: map each answer to one of the four product results.`);
          clean.outcomes = q.outcomes.slice();
        } else {
          clean.answerIndex = number(q.answerIndex, `${label}: correct answer`, true);
          if (clean.answerIndex < 0 || clean.answerIndex >= clean.options.length) fail(`${label}: select a correct answer from its choices.`);
        }
        if (slug === "jeopardy") {
          clean.category = text(q.category, `${label}: category`, 60);
          clean.points = number(q.points, `${label}: points`, true);
          if (clean.points < 1 || clean.points > 10000) fail(`${label}: points must be between 1 and 10,000.`);
        }
      }
      return clean;
    });
    if (slug === "jeopardy") {
      const groups = new Map();
      questions.forEach((q) => {
        const key = q.category.toLowerCase();
        const points = groups.get(key) || new Set();
        if (points.has(q.points)) fail(`Category "${q.category}" contains duplicate point values.`);
        points.add(q.points); groups.set(key, points);
      });
      if (groups.size > 6 || [...groups.values()].some((p) => p.size > 6)) fail("Jeopardy supports up to 6 categories with up to 6 questions each.");
    }
    const content = { gameSlug: slug, questions };
    if (input.cards !== undefined) {
      if (slug !== "a8-recall" || !Array.isArray(input.cards) || input.cards.length !== 6) fail("Recall needs exactly six memory cards.");
      content.cards = input.cards.map((card, i) => {
        // A card is a name and an optional picture. (An older optional detail line is still accepted but no longer shown.)
        const clean = { title: text(card?.title, `Memory card ${i + 1}: title`, 100) };
        const detail = text(card?.detail, `Memory card ${i + 1}: detail`, 200, true);
        if (detail) clean.detail = detail;
        const image = card?.image;
        if (image !== undefined && image !== null && image !== "") {
          if (typeof image !== "string" || image.length > CARD_IMAGE_MAX_CHARS || !CARD_IMAGE.test(image)) fail(`Memory card ${i + 1}: the image must be a PNG, JPG, WebP or GIF under 500 KB.`);
          clean.image = image;
        }
        return clean;
      });
      if (new Set(content.cards.map((c) => c.title.toLowerCase())).size !== 6) fail("Memory-card titles must be different.");
    }
    return { ok: true, content };
  } catch (error) {
    return { ok: false, error: error instanceof Error ? error.message : "Invalid question content." };
  }
}

function sampleContent(slug) {
  if (slug === "a8-the-number") return { gameSlug: slug, questions: [
    { text: "How many days are in a leap year?", answer: 366, min: 300, max: 400, step: 1, unit: "days", explanation: "A leap year includes February 29." },
  ] };
  if (slug === "a8-match") return { gameSlug: slug, questions: [
    { text: "What matters most to you?", options: ["City convenience", "Outdoor adventures", "Performance", "Family space"], outcomes: [0, 1, 2, 3] },
  ] };
  const content = { gameSlug: slug, questions: [
    { text: "Which planet is known as the Red Planet?", options: ["Earth", "Mars", "Venus", "Jupiter"], answerIndex: 1, explanation: "Iron oxide gives Mars its reddish appearance." },
  ] };
  if (slug === "jeopardy") Object.assign(content.questions[0], { category: "Science", points: 100 });
  if (slug === "a8-recall") {
    content.questions = [];
    content.cards = [
      { title: "Mars" }, { title: "Earth" }, { title: "Jupiter" },
      { title: "Venus" }, { title: "Mercury" }, { title: "Neptune" },
    ];
  }
  return content;
}

function adaptFiveGameContent(content, products) {
  if (!content) return {};
  if (content.gameSlug === "a8-the-number") return {
    rounds: content.questions.map((q) => ({
      prompt: q.text, answer: q.answer, min: q.min, max: q.max, step: q.step, unit: q.unit || "",
      start: q.min + Math.round((q.max - q.min) / q.step / 2) * q.step, context: q.explanation || "", icon: "target",
    })),
  };
  if (content.gameSlug === "a8-recall") return content.cards ? { pairs: content.cards.map((card, i) => ({ id: `custom-card-${i}`, icon: "sparkles", title: card.title, detail: card.detail || "", ...(card.image ? { image: card.image } : {}) })) } : {};
  const ids = Object.keys(products);
  const questions = content.questions.map((q) => content.gameSlug === "a8-match" ? {
    q: q.text, options: q.options.map((label, i) => ({
      label, sub: "", icon: "sparkles", score: Object.fromEntries(ids.map((id, j) => [id, j === q.outcomes[i] ? 1 : 0])),
    })),
  } : { q: q.text, options: q.options.slice(), answer: q.answerIndex, fact: q.explanation || "" });
  const result = { questions };
  if (content.cards) result.pairs = content.cards.map((card, i) => ({ id: `custom-card-${i}`, icon: "sparkles", title: card.title, detail: card.detail, ...(card.image ? { image: card.image } : {}) }));
  return result;
}

window.CDH_QUIZ_CONTENT={validateGameContent,adaptFiveGameContent};
})();
/* =====================================================================
   Platform embed bridge: runs ONE Activate8 game per page (chosen by the
   /game-previews/<slug>/ path or ?game=), implements the CDH_BRAND_READY /
   CDH_BRAND_UPDATE contract (game/BRANDING_CONTRACT.md), and forwards each
   captured lead to /api/player-submissions. Loaded after the library code,
   only in the staged platform build (see scripts/stage-fivegames-preview.mjs).
   ===================================================================== */
(function () {
  var SLUG_TO_GAME = {
    'a8-match': 'match',
    'a8-trivia-rush': 'trivia',
    'a8-the-number': 'number',
    'a8-spin-to-win': 'spin',
    'a8-recall': 'recall',
  };
  var A = window.Activate8;
  if (!A) return;
  var App = A.App;
  var params = new URLSearchParams(window.location.search);

  var gameId = params.get('game');
  if (!gameId) {
    for (var s in SLUG_TO_GAME) if (window.location.pathname.indexOf(s) !== -1) gameId = SLUG_TO_GAME[s];
  }
  if (!gameId || !A.GAMES[gameId]) return; // no game picked: leave the library page as is

  var slug = '';
  for (var k in SLUG_TO_GAME) if (SLUG_TO_GAME[k] === gameId) slug = k;
  var orderId = params.get('orderId');
  var HEX = /^#[0-9a-fA-F]{6}$/;
  // The customizer's "Game title" field defaults to the game's name; only a title
  // the customer actually changed should replace the start-screen headline.
  var DEFAULT_HEADING = { match: 'Match', trivia: 'Trivia Rush', number: 'The Number', spin: 'Spin to Win', recall: 'Memory' };
  var copy = A.BRANDS.halden.games[gameId];
  var original = { title: copy.title, subtitle: copy.subtitle };
  var questionApi = window.CDH_QUIZ_CONTENT;
  var originalContent = JSON.parse(JSON.stringify(copy));
  var customContent = null;
  var contentReady = !params.has('contentId');
  var logoStyle = document.createElement('style');
  document.head.appendChild(logoStyle);
  // Logo size, title size and title color from the customizer, applied as one stylesheet.
  var brandStyle = { logo: 0, scale: 1, color: null };
  function applyBrandStyle() {
    var css = '';
    if (brandStyle.logo) {
      // !important: the single-game page sets a fixed 48px logo that would otherwise win.
      css += 'body .stage .topbar .logo img{height:' + brandStyle.logo + 'px!important;max-width:' + (brandStyle.logo * 4) + 'px!important}';
      // A tall logo makes the top bar taller on desktop; phones keep their two-row bar.
      css += '@media (min-width:641px){.stage .topbar{height:calc(max(68px,' + (brandStyle.logo + 20) + 'px) + env(safe-area-inset-top,0px))}}';
      css += '@media (max-width:640px){.stage .topbar{grid-template-rows:' + Math.max(60, brandStyle.logo + 8) + 'px auto}}';
    }
    if (brandStyle.scale !== 1) css += '.stage .t-hero{font-size:min(calc(clamp(40px,min(6.2vw,9.6vh),92px)*' + brandStyle.scale + '),16vw)}';
    if (brandStyle.color) css += '.stage .t-hero{color:' + brandStyle.color + '}';
    logoStyle.textContent = css;
  }

  document.body.classList.add('a8-single');

  // Generic "Your Brand" kit until the host sends a theme; the library's demo
  // brands (Halden etc.) never show.
  App.brandId = 'custom';
  App.customBase = 'halden';
  App.custom = { name: '', color: '#0A84FF', logoImg: null, productImg: null };

  // The kit renders the logo URL straight into an <img src>, so only accept
  // image data URIs, http(s) URLs or same-origin paths, and drop characters
  // that could break out of the attribute.
  function safeLogo(url) {
    if (!url || typeof url !== 'string') return null;
    if (!/^(data:image\/|https?:\/\/|\/)/i.test(url)) return null;
    return url.replace(/["'<>\s]/g, '');
  }

  function merge(theme) {
    if (!theme) return;
    var c = App.custom;
    if (Object.prototype.hasOwnProperty.call(theme, 'gameContent') && questionApi) {
      var nextContent = theme.gameContent;
      if (nextContent !== null) {
        var validated = questionApi.validateGameContent(nextContent, slug);
        if (!validated.ok) {
          submissionStatus('Custom questions are invalid: ' + validated.error);
          return;
        }
        nextContent = validated.content;
      }
      customContent = nextContent;
      ['questions', 'rounds', 'pairs', 'meta'].forEach(function (key) {
        if (originalContent[key] !== undefined) copy[key] = JSON.parse(JSON.stringify(originalContent[key]));
      });
      if (customContent) {
        Object.assign(copy, questionApi.adaptFiveGameContent(customContent, A.BRANDS.halden.products));
        copy.meta = (copy.meta || []).map(function (item) {
          return Object.assign({}, item, { text: item.text.replace(/\d+\s+(questions|rounds)/i, customContent.questions.length + ' $1') });
        });
      }
    }
    // No brand name: the customizer only offers a logo and a game title.
    if (theme.primaryColor && HEX.test(theme.primaryColor)) c.color = theme.primaryColor;
    if (theme.logoUrl !== undefined) c.logoImg = safeLogo(theme.logoUrl);
    // The customizer's image upload (bgUrl) is the Recall product image: shown
    // on the face-down cards of the start screen. Video is not accepted.
    if (theme.bgUrl !== undefined) c.productImg = /^data:video/i.test(theme.bgUrl || '') ? null : safeLogo(theme.bgUrl);
    if (typeof theme.heading === 'string') copy.title = theme.heading.trim() && theme.heading.trim() !== DEFAULT_HEADING[gameId] ? theme.heading.trim().slice(0, 160) : original.title;
    if (typeof theme.tagline === 'string') copy.subtitle = theme.tagline.trim().slice(0, 500) || original.subtitle;
    var size = Number(theme.logoSize);
    if (isFinite(size) && size > 0) brandStyle.logo = Math.min(size, 100);
    // Title size is relative to the customizer's default (28px), so the default changes nothing.
    var titleSize = Number(theme.headingSize);
    if (isFinite(titleSize) && titleSize > 0) brandStyle.scale = Math.min(2.5, Math.max(0.4, titleSize / 28));
    // White is the customizer's default title color for dark games, so here it means "unchanged".
    if (typeof theme.headingColor === 'string') {
      brandStyle.color = HEX.test(theme.headingColor) && !/^#f{3}(f{3})?$/i.test(theme.headingColor) ? theme.headingColor : null;
    }
    applyBrandStyle();
  }

  function signature() {
    var c = App.custom;
    return [c.name, c.color, c.logoImg, c.productImg, copy.title, copy.subtitle, JSON.stringify(customContent)].join('|');
  }

  function setTitle() {
    var name = App.custom.name.trim();
    document.title = name ? name + ' — ' + A.GAMES[gameId].name : A.GAMES[gameId].name;
  }

  function openGame() {
    if (contentReady && !App.stage.el) App.play(gameId);
  }

  // Leaving the stage (the X is hidden, but Esc still closes it) just reopens
  // the same game: a platform page is never the library.
  var originalClosed = App.onStageClosed.bind(App);
  App.onStageClosed = function () {
    originalClosed();
    setTimeout(openGame, 150);
  };

  var applied = signature();
  var timer = null;
  function onTheme(theme) {
    merge(theme);
    clearTimeout(timer);
    timer = setTimeout(function () {
      var next = signature();
      if (next === applied) return;
      applied = next;
      setTitle();
      App.applyBrand();
      // The open stage keeps the brand it started with: closing it reopens the
      // game (via onStageClosed above) with the new brand. Resets any round in
      // progress, like every other game's live preview.
      if (App.stage.el) App.stage.close(); else openGame();
    }, 300);
  }

  // Leads: name + email go in the shared player_submissions columns, the rest
  // (game, result, score, answers, code, ...) in `extra`.
  function submissionStatus(message, retry) {
    var status = document.querySelector('.a8-save-status');
    if (!status) {
      status = document.createElement('div');
      status.className = 'a8-save-status';
      status.setAttribute('role', 'status');
      document.body.appendChild(status);
    }
    status.replaceChildren(document.createTextNode(message));
    var button = document.createElement('button');
    button.type = 'button';
    button.textContent = retry ? 'Retry' : 'Dismiss';
    button.addEventListener('click', retry || function () { status.remove(); });
    status.appendChild(button);
  }
  window.A8_ON_LEAD = function (lead) {
    if (!lead || !lead.email) return;
    // Catalog/customizer previews are demos, not live campaigns. Do not send
    // their personal details to persistent storage or promise real prizes.
    if (!orderId || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(orderId)) {
      submissionStatus('Saved in this preview session only. Demo prizes; no emails are sent.');
      return;
    }
    var name = ((lead.firstName || '') + ' ' + (lead.lastName || '')).trim() || 'Player';
    var extra = {};
    ['game', 'result', 'score', 'code', 'optIn'].forEach(function (key) {
      if (lead[key] !== undefined) extra[key] = lead[key];
    });
    function save() {
      submissionStatus('Saving your entry…');
      fetch('/api/player-submissions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gameSlug: slug, orderId: orderId || null, name: name, email: lead.email, extra: extra }),
      }).then(function (response) {
        if (!response.ok) throw new Error('Submission failed');
        submissionStatus('Your entry has been saved.');
      }).catch(function () {
        submissionStatus('Your entry could not be saved. Please retry before leaving this page.', save);
      });
    }
    save();
  };

  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || event.origin !== window.location.origin) return;
    if (event.data && event.data.type === 'CDH_BRAND_UPDATE' &&
        event.data.theme && typeof event.data.theme === 'object') onTheme(event.data.theme);
  });

  // Standalone / live-link load: same fields as query params.
  var initial = {};
  if (params.has('primaryColor')) initial.primaryColor = params.get('primaryColor');
  if (params.has('logo')) initial.logoUrl = params.get('logo');
  if (params.has('bg')) initial.bgUrl = params.get('bg');
  if (params.has('heading')) initial.heading = params.get('heading');
  if (params.has('tagline')) initial.tagline = params.get('tagline');
  if (params.has('logoSize')) initial.logoSize = params.get('logoSize');
  if (params.has('headingSize')) initial.headingSize = params.get('headingSize');
  if (params.has('headingColor')) initial.headingColor = params.get('headingColor');
  merge(initial);
  applied = signature();
  setTitle();
  App.applyBrand();
  function loadSavedQuestions() {
    var id = params.get('contentId');
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id || '')) {
      submissionStatus('This custom-question link is invalid. Please request a new game link.');
      return;
    }
    submissionStatus('Loading custom questions…');
    fetch('/api/branding-drafts/' + encodeURIComponent(id) + '/content', { cache: 'no-store' })
      .then(function (response) { if (!response.ok) throw new Error('load'); return response.json(); })
      .then(function (saved) {
        if (saved.gameSlug !== slug || !saved.gameContent) throw new Error('wrong game');
        var result = questionApi.validateGameContent(saved.gameContent, slug);
        if (!result.ok) throw new Error('invalid content');
        merge({ gameContent: result.content });
        applied = signature();
        contentReady = true;
        var status = document.querySelector('.a8-save-status');
        if (status) status.remove();
        App.applyBrand();
        openGame();
      })
      .catch(function () { submissionStatus('Custom questions could not be loaded. No sample questions have been substituted.', loadSavedQuestions); });
  }
  if (!contentReady) loadSavedQuestions(); else openGame();

  if (window.parent !== window) window.parent.postMessage({ type: 'CDH_BRAND_READY' }, '*');
})();
</script>
