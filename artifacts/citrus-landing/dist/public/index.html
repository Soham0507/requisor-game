    <script>
      // Applies the persisted theme (src/hooks/use-theme.ts, same
      // localStorage key the landing page's own toggle uses) before first
      // paint, on every route — otherwise a page that loads with "dark"
      // missing from <html> would flash light until React hydrates.
      // Light is the default; dark only when the visitor has chosen it.
      try {
        if (localStorage.getItem("immerse-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        /* no storage: stay on the light default */
      }
    </script>
