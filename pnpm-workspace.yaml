packages:
  - artifacts/*
  - artifacts/games/*
  - lib/*
  - lib/integrations/*
  - scripts
  - artifacts/citrus-landing/game/AI-versionBB2-5/AI-versionBB2-5
  - artifacts/citrus-landing/game/Soccer/Soccer
  - artifacts/citrus-landing/game/Cybergame/artifacts/gesturesec-runner
  - artifacts/citrus-landing/game/Gesture-Space-War/Gesture-Space-War/artifacts/space-game
  - artifacts/citrus-landing/game/On-The-Fly-Video/On-The-Fly-Video/artifacts/boat-booth
  - artifacts/citrus-landing/game/jeoparady/frontend
  - artifacts/citrus-landing/game/Lexus

allowBuilds:
  '@parcel/watcher': set this to true or false
  bufferutil: set this to true or false
  core-js: set this to true or false
  esbuild: set this to true or false

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.2
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.1
  '@types/node': ^25.9.9
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.2.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.3
  framer-motion: ^12.43.0
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  vite: ^7.3.6
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

