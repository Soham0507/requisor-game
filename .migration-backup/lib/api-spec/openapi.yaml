openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: games
    description: Brandable game catalog
  - name: branding-drafts
    description: In-progress branding customizations for a game
  - name: custom-ui-requests
    description: Requests for a fully custom UI build
  - name: player-submissions
    description: Player info captured at game-over by a brandable game (every game except Boat Booth)
  - name: scenes
    description: Boat Booth experience scenes
  - name: generations
    description: Boat Booth photo and video generations
  - name: booth
    description: Boat Booth dashboard data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List the brandable game catalog
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /games/{slug}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a single game by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Game not found
  /branding-drafts:
    post:
      operationId: upsertBrandingDraft
      tags: [branding-drafts]
      summary: Create or update a branding draft for a game
      description: Upserts by the combination of gameId + draftToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBrandingDraftRequest"
      responses:
        "200":
          description: The saved branding draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingDraft"
  /branding-drafts/{id}:
    get:
      operationId: getBrandingDraft
      tags: [branding-drafts]
      summary: Get a branding draft by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The branding draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingDraft"
        "404":
          description: Draft not found
  /branding-drafts/{id}/finalize:
    post:
      operationId: finalizeBrandingDraft
      tags: [branding-drafts]
      summary: Finalize a branding draft and create a pending order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeBrandingDraftRequest"
      responses:
        "200":
          description: The created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Draft not found
  /custom-ui-requests:
    post:
      operationId: createCustomUiRequest
      tags: [custom-ui-requests]
      summary: Submit a request for a fully custom UI build
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomUiRequestRequest"
      responses:
        "200":
          description: The created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomUiRequest"
  /player-submissions:
    post:
      operationId: createPlayerSubmission
      tags: [player-submissions]
      summary: Submit player info captured at game-over
      description: Resolves gameSlug to the game's id server-side — the embedded game knows its own slug, not the row's database id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerSubmissionRequest"
      responses:
        "200":
          description: The created player submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSubmission"
        "404":
          description: Game not found
  /scenes:
    get:
      operationId: listScenes
      tags: [scenes]
      summary: List boat experiences
      description: Returns the available boat experiences a visitor can choose from
      responses:
        "200":
          description: List of scenes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scene"
  /generations:
    get:
      operationId: listGenerations
      tags: [generations]
      summary: Recent creations
      description: Returns the most recent booth creations for the live gallery
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Recent generations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Generation"
    post:
      operationId: createGeneration
      tags: [generations]
      summary: Create a photo from a visitor snapshot
      description: Takes the visitor's captured photo and a chosen scene, then generates a photoreal image of them enjoying that boat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationInput"
      responses:
        "201":
          description: Generation created with photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generation"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Generation provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /generations/{id}:
    get:
      operationId: getGeneration
      tags: [generations]
      summary: Get a generation
      description: Returns the current status, photo, and video for a generation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /generations/{id}/video:
    post:
      operationId: startVideo
      tags: [generations]
      summary: Animate a generated photo into a video
      description: Kicks off image-to-video generation for an existing photo generation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Video generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Generation provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /booth/stats:
    get:
      operationId: getBoothStats
      tags: [booth]
      summary: Booth stats
      description: Aggregate counts for the booth dashboard
      responses:
        "200":
          description: Booth stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoothStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BrandSupport:
      type: string
      enum: [full, chrome_only]
    Game:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        tagline:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
        previewBasePath:
          type: string
          nullable: true
        brandSupport:
          $ref: "#/components/schemas/BrandSupport"
        defaultPrimaryColor:
          type: string
        defaultSecondaryColor:
          type: string
        defaultAccentColor:
          type: string
        defaultLogoUrl:
          type: string
          nullable: true
        defaultHeading:
          type: string
        priceCents:
          type: integer
      required:
        - id
        - slug
        - name
        - tagline
        - brandSupport
        - defaultPrimaryColor
        - defaultSecondaryColor
        - defaultAccentColor
        - defaultHeading
        - priceCents
    UpsertBrandingDraftRequest:
      type: object
      properties:
        gameId:
          type: string
        draftToken:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        logoDataUrl:
          type: string
          nullable: true
        bgDataUrl:
          type: string
          nullable: true
        fontDataUrl:
          type: string
          nullable: true
        heading:
          type: string
        tagline:
          type: string
          nullable: true
      required:
        - gameId
        - draftToken
        - primaryColor
        - secondaryColor
        - accentColor
        - heading
    BrandingDraft:
      type: object
      properties:
        id:
          type: string
        gameId:
          type: string
        draftToken:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        logoDataUrl:
          type: string
          nullable: true
        bgDataUrl:
          type: string
          nullable: true
        fontDataUrl:
          type: string
          nullable: true
        heading:
          type: string
        tagline:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, finalized]
      required:
        - id
        - gameId
        - draftToken
        - primaryColor
        - secondaryColor
        - accentColor
        - heading
        - status
    FinalizeBrandingDraftRequest:
      type: object
      properties:
        contactEmail:
          type: string
          nullable: true
    Order:
      type: object
      properties:
        id:
          type: string
        brandingDraftId:
          type: string
        gameId:
          type: string
        status:
          type: string
          enum: [pending_payment]
        totalAmountCents:
          type: integer
        contactEmail:
          type: string
          nullable: true
      required:
        - id
        - brandingDraftId
        - gameId
        - status
        - totalAmountCents
    CreateCustomUiRequestRequest:
      type: object
      properties:
        gameId:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        message:
          type: string
      required:
        - name
        - email
        - message
    CustomUiRequest:
      type: object
      properties:
        id:
          type: string
        gameId:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        message:
          type: string
      required:
        - id
        - name
        - email
        - message
    CreatePlayerSubmissionRequest:
      type: object
      properties:
        gameSlug:
          type: string
        orderId:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        extra:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - gameSlug
        - name
        - email
    PlayerSubmission:
      type: object
      properties:
        id:
          type: string
        gameId:
          type: string
        orderId:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
        extra:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - id
        - gameId
        - name
        - email
    Scene:
      type: object
      required: [id, name, tagline, description]
      properties:
        id:
          type: string
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
    GenerationInput:
      type: object
      required: [sceneId, photoBase64]
      properties:
        sceneId:
          type: string
          minLength: 1
        photoBase64:
          type: string
          minLength: 1
          description: Data URI or raw base64 of the visitor's captured photo
        visitorName:
          type: string
    Generation:
      type: object
      required:
        - id
        - sceneId
        - sceneName
        - photoStatus
        - videoStatus
        - createdAt
      properties:
        id:
          type: string
        sceneId:
          type: string
        sceneName:
          type: string
        visitorName:
          type: string
          nullable: true
        photoStatus:
          type: string
          description: One of pending, ready, failed
        videoStatus:
          type: string
          description: One of idle, pending, ready, failed
        photoUrl:
          type: string
          nullable: true
        videoUrl:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
    BoothStats:
      type: object
      required: [totalCreations, videosCreated, sceneBreakdown]
      properties:
        totalCreations:
          type: integer
        videosCreated:
          type: integer
        sceneBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SceneCount"
    SceneCount:
      type: object
      required: [sceneId, sceneName, count]
      properties:
        sceneId:
          type: string
        sceneName:
          type: string
        count:
          type: integer
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

