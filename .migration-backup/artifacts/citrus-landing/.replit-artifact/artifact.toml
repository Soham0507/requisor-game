kind = "web"
previewPath = "/"
title = "Requisor.AI"
version = "1.0.0"
id = "artifacts/citrus-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23597

[services.development]
run = "pnpm --filter @workspace/citrus-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/citrus-landing", "run", "build" ]
publicDir = "artifacts/citrus-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23597"
BASE_PATH = "/"
