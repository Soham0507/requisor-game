<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Generic, unbranded share metadata: this game ships white-labelled and
         is re-skinned per customer at runtime, so it must not carry the
         original AppViewX demo branding. The previous og:image also pointed at
         a file that never existed in the repo. -->
    <meta property="og:title" content="Basketball Shootout" />
    <meta property="og:description" content="Beat the shot clock in a gesture-controlled basketball challenge." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Basketball Shootout" />
    <meta name="twitter:description" content="Beat the shot clock in a gesture-controlled basketball challenge." />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="47-Day Shootout" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preload" as="font" type="font/otf" href="/fonts/Sohne-Kraftig.otf" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'activated') {
                      console.log('SW updated, new version active');
                    }
                  });
                }
              });
            })
            .catch((err) => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
