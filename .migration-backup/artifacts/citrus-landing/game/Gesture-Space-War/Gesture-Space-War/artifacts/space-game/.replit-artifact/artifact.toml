kind = "web"
previewPath = "/"
title = "Space Survivor"
version = "1.0.0"
id = "artifacts/space-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19725

[services.development]
run = "pnpm --filter @workspace/space-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/space-game", "run", "build" ]
publicDir = "artifacts/space-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19725"
BASE_PATH = "/"
